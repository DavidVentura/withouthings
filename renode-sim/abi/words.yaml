# Hand-declared facts about individual candidate words, which
# abi/classify_words.py applies before any of its heuristics and never lets one
# overrule. An entry is an argument someone made and can be attacked; a
# heuristic is a rule that fires on shape alone, and the words below are the
# ones whose shape says nothing or says the wrong thing.
#
# `value` is what the image holds at `address`; classify_words refuses the file
# if it does not, so an entry cannot survive the image changing under it.
# `class` is `constant` or `pointer`; a pointer also gives `target` (an address,
# or a name the partition gives a function) and `addend`, which together are the
# address it names. `why` names an entry in `reasons`.

# Values that name something by contract rather than by the linker having put it
# there, whatever word holds them. These are the two the image has.
contracts:
  0x27000: >
    The SoftDevice's application base. It is the size field of the MBR/
    SoftDevice structure (FIRMWARE.md), the address the bootloader copies the
    appl part to, and what the app hands sd_softdevice_vector_table_base_set.
    The vector table is pinned there anyway, so a word holding it cannot go
    stale either way.
  0xf117c: >
    The app image end, which is a length in disguise.

# Several peripherals of the SVD share a base address, because the hardware
# block is one and the programming models are alternatives. Which one this
# firmware drives is a fact about the firmware, so it is declared here; the
# evidence is hwa10.repl, whose model at each base is the one the application
# boots and runs against in the simulator.
peripherals:
  - base: 0x40002000
    peripheral: UART0
    why: >
      The console. hwa10.repl gives 0x40002000 a UART with easyDMA off and the
      app drives TXD/RXD a byte at a time, which is UART0 and not UARTE0.

  - base: 0x40003000
    peripheral: TWI0
    why: >
      The I2C bus the charger, the crown, both thermometers, the light sensor
      and the barometer sit on. hwa10.repl models it as NRF52840_I2C, the
      non-EasyDMA controller, which is TWI0 rather than TWIM0 or TWIS0.

  - base: 0x40004000
    peripheral: SPIM1
    why: >
      The optical front end's bus. The firmware arms TXD/RXD EasyDMA and
      TASKS_START on this instance, which is the SPIM programming model; the
      repl's comment records the same reading.

  - base: 0x4001E000
    peripheral: NVMC
    why: >
      The flash controller the update path writes through. ACL shares the base
      and this image never configures a protection region; the repl models an
      NVMC here and nothing else.

  - base: 0x40023000
    peripheral: SPIM2
    why: >
      The SPI flash and the accelerometer, told apart by chip select. The
      controller is the master with EasyDMA, which is SPIM2.

reasons:
  unit_table_six_byte_records: >
    The unit table at 0xbe4d0: 48 records of (u16 code, u16 size, u16 flag),
    which the record walk confirms end to end -- the third field is 0 or 1 in
    every one of them, and the record before 0xbe4d0 and the one after 0xbe5ef
    both fail that. A 4-aligned window over 6-byte records reads the high half
    of one field and the low half of the next, so the address-looking values it
    produces are two numbers side by side. Relocating four of them is what
    corrupted this table before the word-slot test existed.

  be6b0_two_u16_fields: >
    0x00040001 at 0xbe6b0 is the pair of u16 fields 1 and 4 of the record that
    starts there, not a pointer. It is the analysis artefact DEVELOPMENT.md
    records: a seed named the second halfword of a `bl`, Ghidra disassembled
    from it, and this word was left typed as a pointer by the wreckage.

  names_a_string_run: >
    The value is the first byte of a NUL-terminated run of printable bytes that
    no instruction covers, which is a string and which objectify already keeps
    whole as one section. Naming a string's first byte is what a string pointer
    does and nothing else in this image does it; the run this word sits in is a
    table of them mixed with counts and flags, which is why the stride test
    could not see the slot.

  observed_address: >
    The runs dereferenced it. A hook on every instruction that loads this word
    recorded the instruction count of the first load, and a watchpoint on the
    address it holds recorded the first read of those bytes; the read came after
    the load, so the value reached memory as an address. A word in a run shares
    its load sites with the run's base, so what this proves for a table column
    is that the column is read through, which is what makes it a pointer field.

