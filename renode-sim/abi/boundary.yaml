    sites: 2
    tail_sites: 2
    symbol: "pvPortMalloc"
    how: "matches.yaml 0.727"
    confidence: "high"
  - addr: 0x51afc
    sites: 2
    tail_sites: 1
    symbol: "vPortFree"
