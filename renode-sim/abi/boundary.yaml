  - addr: 0x72f10
    sites: 11
    symbol: vTaskDelete
    confidence: high
    how: >
      body: enter critical, NULL handle -> pxCurrentTCB,
      uxListRemove(&xStateListItem), uxListRemove(&xEventListItem) when
      pvContainer(+0x28) set, uxTaskNumber++,
      vListInsertEnd(xTasksWaitingTermination) and
      uxDeletedTasksWaitingCleanUp++ for the running task, then
      portYIELD_WITHIN_API. Top reference candidate too.
  - addr: 0x7300c
