# --- library -> app ---------------------------------------------------------
# These become PROVIDE-style defined symbols in the blob object, so the source
# library can be linked against the app's hooks.
lib_to_app:
  - addr: 0x2eca8
    sites: 1
    symbol: "vApplicationGetIdleTaskMemory"
    confidence: "high"
    how: "only caller is vTaskStartScheduler@0x7300c, which calls it right before xTaskCreateStatic"
  - addr: 0x36cbc
    sites: 1
    symbol: "vApplicationStackOverflowHook"
    confidence: "high"
    how: "only caller is vTaskSwitchContext@0x7333c, i.e. taskCHECK_FOR_STACK_OVERFLOW with method 2"
  - addr: 0x36e84
    sites: 2
    symbol: vApplicationTickHook
    confidence: high
    how: >
      Both sites are inside xTaskIncrementTick, not one there and one in
      xTaskResumeAll as first read: 0x73112 sits in the not-suspended arm behind
      `cbnz uxPendedTicks`, and 0x731aa in the suspended arm right after
      `++uxPendedTicks`. That is configUSE_TICK_HOOK == 1 verbatim, guard
      comment included ("guard against the tick hook being called when the
      pended tick count is being unwound"), so tasks.c is stock here and the
      config needs configUSE_TICK_HOOK 1. xTaskResumeAll at 0x731dc is stock and
      calls no hook at all.
  - addr: 0x5e7a8
    sites: 6
    symbol: vAssertCalled
    confidence: high
    how: >
      the configASSERT logger; called with a format/file pointer in r0 and the
      __LINE__ value in r1 from queue.c lines 400/523/617 and from tasks.c.
      symbols.txt calls it wlog_fmt_r0d.
  - addr: 0x80b8c
    sites: 1
    symbol: null
    confidence: "low"
    how: "app callback out of the 0x81220 SDK-library span"
  - addr: 0x80bb8
    sites: 1
    symbol: null
    confidence: "low"
    how: "app callback out of the 0x81220 SDK-library span"
  - addr: 0x80bfc
    sites: 1
    symbol: null
    confidence: "low"
    how: "app callback out of the 0x81220 SDK-library span"
  - addr: 0x933c6
    sites: 1
    symbol: null
    confidence: "low"
    how: "called from nrfx_saadc_init; inside the kept SAADC driver, so it never crosses the relink boundary"
  - addr: 0xa86c2
    sites: 2
    symbol: "memset"
    confidence: "high"
    how: "(ptr, 0, len) from prvInitialiseNewTask and the SAADC driver"
  - addr: 0xa8812
    sites: 2
    symbol: "memcpy"
    confidence: "high"
