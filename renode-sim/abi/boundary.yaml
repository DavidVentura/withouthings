# The Withings-code <-> open-source-library boundary of appl v3411, named.
#
# Hand-written from abi/matches.yaml plus body reading against the reference
# build (~/ref-build, abi/refbuild.sh). `how` records what decided each name,
# `confidence` is high/medium/low. blobify.py consumes this file and refuses
# any boundary site whose target is not listed here.
#
# Sites were found twice and agreed exactly: a raw scan of appl.bin for Thumb
# branch encodings whose target lands in a library range, and the linear
# disassembly abi/match.py already produces. 647 app->library `bl` sites and 96
# `b.w` tail calls reach 62 distinct library entry points; 26 library->app sites
# reach 14. The tail calls are a boundary crossing exactly like the calls, and
# missing them is what wedged the first relinked image: three of them are
# vPortExitCritical, so the blob decremented its own dead uxCriticalNesting
# while the source kernel's climbed, basepri never dropped and PendSV was never
# taken (see tail_sites below).

meta:
  image: appl.bin
  app_base: 0x27000
  app_to_lib: {sites: 647, tail_sites: 96, targets: 62}
  lib_to_app: {sites: 26, targets: 14}

# Config corrections forced by the image's own struct layouts. refbuild.sh's
# FreeRTOSConfig.h is wrong on three knobs; every queue.c body's match score
# rises when they are fixed (xQueueGiveFromISR 0.29 -> 0.82,
# xQueueGenericSendFromISR 0.44 -> 0.67, xQueueGenericSend 0.29 -> 0.57,
# xQueueGenericCreate 0.17 -> 0.48, xQueueGenericCreateStatic 0.29 -> 0.42).
config_corrections:
  configUSE_QUEUE_SETS: 1        # Queue_t is 0x54 with pxQueueSetContainer at 0x48
  configMAX_TASK_NAME_LEN: 12    # with RECORD_STACK_HIGH_ADDRESS this is the only
  configRECORD_STACK_HIGH_ADDRESS: 1  # TCB layout giving pxTaskTag 0x54 in 0x60 bytes
  configUSE_TICK_HOOK: 1         # xTaskIncrementTick calls 0x36e84 from both arms
  notes: >
    Queue_t read off the image: pcHead 0x00, pcTail 0x04, pcWriteTo 0x08,
    u 0x0c, xTasksWaitingToSend 0x10, xTasksWaitingToReceive 0x24,
    uxMessagesWaiting 0x38, uxLength 0x3c, uxItemSize 0x40, cRxLock 0x44,
    cTxLock 0x45, ucStaticallyAllocated 0x46, pxQueueSetContainer 0x48,
    uxQueueNumber 0x4c, ucQueueType 0x50, sizeof 0x54 (xQueueGenericCreate
    mallocs len*size + 0x54). TCB_t: pxTopOfStack 0x00, xStateListItem 0x04,
    xEventListItem 0x18, uxPriority 0x2c, pxStack 0x30, pcTaskName[12] 0x34,
    pxEndOfStack 0x40, uxTCBNumber 0x44, uxTaskNumber 0x48, uxBasePriority
    0x4c, uxMutexesHeld 0x50, pxTaskTag 0x54, ulNotifiedValue 0x58,
    ucNotifyState 0x5c, sizeof 0x60.
    configASSERT is a logging assert: the queue.c asserts call 0x5e7a8 with the
    __LINE__ value in r1 (400 in xQueueGenericCreate, 523 in xQueueCreateMutex,
    617 in xQueueGiveMutexRecursive), which also dates the kernel source.

# Spans of the image the library occupies, as abi/matches.yaml brackets them
# (first to last matched function of each run). A `bl` from inside a span is a
# library-internal call and is not part of the boundary. The spans understate
# the library slightly at their edges -- prvInitialiseTaskLists below 0x72eb0,
# SAADC_IRQHandler above 0x7e138 -- which is why a handful of kernel-global pool
# references look like app references; see data_references.
library_ranges:
  - [0x27da6, 0x27e50]
  - [0x51a04, 0x51afc]
  - [0x72eb0, 0x73e5c]
  - [0x7db08, 0x7e138]
  - [0x81220, 0x812a8]
  - [0x8f42c, 0x8f42c]
  - [0x9e32c, 0x9ea2e]
  - [0xa4e3a, 0xa4e3a]

# --- app -> library ---------------------------------------------------------
# `keep` means the call is NOT relocated: the blob keeps calling its own copy.
app_to_lib:
