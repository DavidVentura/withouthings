# --- data references --------------------------------------------------------
# Literal-pool words holding an address of a kernel or driver global.
#
# The kernel's own RAM was located from the pools of the matched library bodies:
# 39 distinct RAM addresses, clustering at 0x200218fc..0x20021a84 (tasks.c and
# queue.c statics: xTickCount 0x20021920, pxCurrentTCB 0x200219fc, the ready
# lists, xSchedulerRunning, uxSchedulerSuspended) and 0x2001ae04..0x2001af9c
# (heap_4).
#
# Result: NO pool word in Withings code points into either cluster. Every one of
# the 79 sites that looked like an app reference is inside a library body that
# the matches.yaml spans simply failed to bracket -- 0x72d4a..0x72e9c
# (prvInitialiseTaskLists / prvCheckTasksWaitingTermination, below the 0x72eb0
# span start), 0x27da2..0x27da4 (prvIdleTask), 0x519ba..0x519dc (prvHeapInit),
# 0x7e41a..0x7e4c2 (SAADC_IRQHandler, past the 0x7e138 span end). The remaining
# words (0x20006d48, 0x20007208, 0x20017c84, 0x20024670, 0x20027185, 0x20027248)
# are Withings globals that library code also touches, not kernel state.
#
# So the app carries no R_ARM_ABS32 against a kernel global. What it does carry
# is the vector table.
data_references:
  kernel_ram: [0x200218fc, 0x20021a84]
  heap4_ram: [0x2001ae04, 0x2001af9c]
  app_pool_words_into_kernel_ram: 0
  app_pool_words_into_library_flash: 2   # 0x7e2a9 and 0xa4fa1, both SAADC, both kept
  vector_table:
    # appl.bin's vector table at 0x27000. Three entries are kernel code and must
    # move with the relink, or the image ends up with two kernels: the source one
    # the app calls and the blob's one the interrupts still enter.
    - index: 11
      word: 0x27e21
      symbol: "SVC_Handler"
      relocate: true
    - index: 14
      word: 0x27e51
      symbol: "PendSV_Handler"
      relocate: true
    - index: 52
      word: 0x73e71
      symbol: "RTC2_IRQHandler"
      relocate: true
      note: "the FreeRTOS tick ISR; the RTC2 port owns RTC2, so nrfx must not"
    - index: 23
      word: 0x7e16d
      symbol: "SAADC_IRQHandler"
      relocate: false
      note: "part of the kept Withings SAADC driver"
    - index: 1
      word: 0x34939
      symbol: "Reset_Handler"
      relocate: false
      note: "app entry, exported"

# --- startup ----------------------------------------------------------------
# Calls diverted at startup so the relinked image can initialise what the blob
# knows nothing about. Each entry rewrites one `bl` to call `symbol` instead of
# `original`, and exports `original` so the glue can call it afterwards.
startup:
  - site: 0x34968
    original: 0x34854
    original_symbol: appl_SystemInit
    symbol: relink_startup
    how: >
      Reset_Handler is 0x34938 (vector 1 holds 0x34939) and 0x34968 is its first
      instruction that is a call; the target 0x34854 is the MDK SystemInit
      (NFCT/reset-pin UICR handling and the errata workarounds, ending in the
      FICR-to-RAM copy). Everything before it is the DEBUG/RESET register writes
      at the top of Reset_Handler, and the blob's own .bss clear and first kernel
      call (0x36a94, 0x51974) come after, so this is the earliest point that
      still precedes any use of the source library's RAM.
