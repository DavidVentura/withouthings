tables:
  - name: wpp_cmd_table
    address: 0x274b4
    entry: wpp_cmd_entry
    stride: 12
    count: 148
    notes: >
      master-request dispatch: the commands the phone sends. Runs 0x274b4 to
      0x27ba4, not to 0x27c04: the dispatcher at 0x6c784 and the send path's
      name lookup at 0x6bdbe both load the pair (0x274b4, 0x27ba4) and step by
      12 between them, and the eight rows above 0x27ba4 are walked by a
      different dispatcher (0x6e788) that loads (0x27ba4, 0x27c04) and calls its
      handler with three arguments instead of two. They are declared separately
      as wpp_cmd_table_slave. The rows themselves have the same shape either
      way, which is why a walk by shape alone reads the two as one table of 156; an earlier reading started it at 0x27994, which is row 104, not
      the head. abi/autonames.py walks it in both directions from there and
      stops where the row stops being {command id, odd handler in the image,
      pointer to a printable name}; the row above the head belongs to the
      shell's own table (0x27100, 79 rows, a different shape: the command word
      first and two entry points after it). Each row's name string is the handler's
      source name, which is where abi/autonames.yaml's wppcmd class comes from.
      No literal-pool reference to the table exists in the image, so the walker
      reaches it some other way; replacing a handler word in place works
      regardless (proven by diverting the battery handler to a logging hook).
  - name: wpp_cmd_table_slave
    address: 0x27ba4
    entry: wpp_cmd_slave_entry
    stride: 12
    count: 8
    notes: >
      The eight rows above wpp_cmd_table, dispatched by 0x6e788 rather than
      0x6c784. Both bounds are its own literal pool pair (0x6e7d4 and 0x6e7d8,
      repeated at 0x6e830/0x6e834), it logs "[WPP][<-]"-style lines with the
      row's name from +8 like the master walk, and it tail-calls the handler at
      +4 as `bx r3` after loading three arguments, so these handlers have a
      different prototype from the master-request ones. In address order the
      commands are SYNC_REQUEST 321, LOCAL_EVENT_NOTIFY 2459, MEASURE_STOP 2420,
      MEASURE_START 2419, NOTIFICATION_GET 2404, GLYPH_GET 2403,
      WORKOUT_STOP 318 and WORKOUT_START 317.
  - name: shell_cmd_table
    address: 0x27100
    entry: shell_cmd_entry
    stride: 12
    count: 79
    notes: >
      the UART debug console's dispatch, sorted by command word so the walk can
      stop early. Head and end are the pair of literal-pool words every reader
      loads (0x27100 and 0x274b4 at 0x59cb8, 0x5a020, 0x5a134 and 0x5a270), and
      the stride is the reader's own `adds r5, #0xc` / `ldr r1, [r4], #12`; the
      end is where wpp_cmd_table begins, so the two tables abut. An earlier
      reading put the head at 0x270f8, which is inside the vector table and
      shifted every row's name onto the previous row's handler.
  - name: i2c_device_table
    address: 0xb22c4
    entry: i2c_device
    stride: 28
    count: 7
  - name: spi_device_table
    address: 0xb2438
    entry: spi_device
    stride: 20
    count: 2
    notes: >
      The two SPIM2 devices, the external flash (cs_pin 0x000f0000) and the
      ADXL367 (0x00100000); cs_pin is the {u16 port, u16 pin} pair the gpio_pin
      table uses, so those read as P0.15 and P0.16. An earlier reading put the
      table at 0xb23c0 with three rows, which is wrong: 0xb23c0 and 0xb2404 are
      two more devices of the same shape (max86173 on SPIM1 CS P0.26 and the
      device on CS P0.25) but they are not contiguous with each other or with
      this pair, because each one's bus descriptor sits between them (0xb23c0's
      bus is 0xb23d4, which holds SPIM1's 0x40004000 at 0xb23f4, the address
      symbols.txt calls spi1_cfg). At stride 20 from 0xb23c0 the second row
      would start inside that bus descriptor and its name field would be
      0xb23ec, which is not a string.
  - name: gpio_pin_table
    address: 0xbe470
    entry: gpio_pin
    stride: 4
    count: 24
    notes: >
      symbols.txt puts this at 0xbe458; that is 0x18 too low. 0xbe458..0xbe46f
      are the three ble_gap_conn_params_t (12,12,{0,15,30},600) FIRMWARE.md
      describes. The {port,pin} descriptors start at 0xbe470, which is what
      makes 0xbe478 = {1,13} (crown MOTION) and 0xbe4c8 = {1,11} (click).
  - name: ble_conn_params_table
    address: 0xbe458
    entry: ble_gap_conn_params
    stride: 8
    count: 3
  - name: asset_table
    address: 0xbbf50
    entry: asset_entry
    stride: 12
    count: 70
    notes: >
      The image assets the UI draws. 70 rows of {u8 width, u8 height, u16 zero,
      const void *bits, u32 frames}, 0xbbf50..0xbc298, whose bits run
      0xeba84..0xee6xx in internal flash -- so the app does carry bitmaps, which
      is what the absence of a grid over this run hid. The extent is the run
      itself: below 0xbbf50 the bytes are an array of 0x64, at 0xbc298 a
      different object starts whose first word points back into itself, and 40
      literal-pool words name rows of the table and nothing between them. width
      is settled by the drawing routine 0x84878, whose first instruction is
      `ldrb r5,[r2,#0]` followed by `rsb r5,r5,#144`, halved and added to the x
      argument: the panel is 144 wide and the asset is centred on it. frames is
      settled by the offsets: where the asset is uncompressed the distance to
      the next row's offset is exactly width * height * frames / 8 (row 0 is
      44 x 58, four frames, 1276 bytes). Without the grid the pool words naming
      rows read as numbers and the 70 bits pointers read as numbers too, so a
      layout that moved the bitmaps would have left every one of them stale.
  - name: bq25180_reg_names
    address: 0xb2674
    entry: name_ptr
    stride: 4
    count: 13
    notes: >
      The firmware's own name for every BQ25180 register, indexed by register
      address 0x00..0x0c. The shape is a pointer table, not the char[12] array
      the right-padded strings suggest: the reader at 0x435d2 loads this address
      and does `ldr r2, [r2, r4, lsl #2]` with r4 the register number, and the
      strings it points at are scattered (STAT0 0xd48f8, ICHG_CTRL 0xd4954 and
      CHARGECTRL1 0xd4979 sit among the log formats that also name them, the
      other ten run 0xd4a30..0xd4aa8). The names are padded to 11 columns
      because they are printed in one aligned column by the shell's `dump`.
      0xb2674 is where the run of string pointers starts and 0xb26a8 is where it
      stops; the four pointers below it are ble_state_names. Three call sites
      index it: 0x43600 (the register dump), 0x436ac and 0x43770/0x43784, all of
      which report through "[BQ25180] error reading %s" (0xd4917).
  - name: bq25180_charge_status_names
    address: 0xb2664
    entry: name_ptr
    stride: 4
    count: 4
    notes: >
      the four colourised strings the "[BQ25180] CHG = %hu, %s" line selects
      between at 0x439fc, indexed by STAT0's two-bit CHG field: not charging,
      constant current, constant voltage, done/disabled
  - name: ble_state_names
    address: 0xb2654
    entry: name_ptr
    stride: 4
    count: 4
    notes: >
      BLE_STOP, BLE_SYNC_REQUEST, BLE_NORMAL, BLE_END; loaded by 0x40b38,
      0x40b94, 0x40bc4 and 0x40c2c, and bounded below by a non-pointer word
  - name: max86173_channel_names
    address: 0xb411c
    entry: name_ptr
    stride: 4
    count: 25
    notes: >
      the MAX86173 measurement channels by name (PPG_AFIB, HR_LOW, HR_HIGH,
      INACTIVITY, PPG_AFIB_NIGHT, then the twenty LED/photodiode pairings and
      the four ambient ones), loaded once at 0x518f4; the word below the run is
      zero and the word above is not an address
  - name: adxl367_mode_names
    address: 0xb47f0
    entry: name_ptr
    stride: 4
    count: 4
    notes: >
      OFF, BURST_AUTO_STOP, BURST_MANUAL_STOP, CONTINUOUS -- the measure modes
      "[ADXL367] Set mode %d" counts; loaded at 0x62320
  - name: afib_class_names
    address: 0xb4824
    entry: name_ptr
    stride: 4
    count: 5
    notes: >
      UNDEFINED, NSR, AFIB, OTHER, NOISE -- the AFib classifier's verdicts,
      loaded at 0x63570 and 0x63608
  - name: flash_id_table
    address: 0xb427c
    entry: flash_id
    stride: 16
    count: 28

table_structs:
  - name: fwblk_table
    fields: [[u32, payload_offset], [u32, len], [void *, body]]
    notes: >
      what fwblk_table_parse fills at 0x4cb5c..0x4cb66: the external-flash
      offset of the payload (the header offset plus 4), the u16 length from the
      header widened to a word, and the buffer holding header + payload + CRC32
  - name: wpp_cmd_entry
    fields: [[u32, command], [wpp_cmd_handler, handler], [const char *, name]]
    notes: >
      handler has the Thumb bit set and name points at the handler's source
      name; abi/autonames.py walks the table on exactly that shape. The
      dispatcher 0x6c784 loads the row's +0 as a u16 to compare and its +4 as
      the call target, so command is only ever read sixteen bits wide.
  - name: wpp_cmd_slave_entry
    fields: [[u32, command], [wpp_cmd_slave_handler, handler], [const char *, name]]
    notes: >
      the same three words as wpp_cmd_entry, which is why a walk by shape alone
      reads the two tables as one; the difference is the dispatcher, and so the
      handler's prototype.
  - name: shell_cmd_entry
    fields: [[const char *, name], [shell_cmd_run, run], [shell_cmd_help, help]]
    notes: >
      both entry points carry the Thumb bit as stored. The walk at 0x5a224
      strcmps the argument against +0, calls +4 with (argc, argv), and calls +8
      instead when any argument is "--help" (0x5a278).
  - name: i2c_device
    fields: [[void *, bus], [u32, addr], [u32, unknown], [void *, fn0],
             [void *, fn1], [void *, fn2], [void *, fn3]]
  - name: spi_device
    fields: [[void *, bus], [u32, cs_pin], [u32, mode], [u32, state], [const char *, name]]
  - name: gpio_pin
    fields: [[u16, port], [u16, pin]]
  - name: ble_gap_conn_params
    fields: [[u16, min_conn_interval], [u16, max_conn_interval],
             [u16, slave_latency], [u16, conn_sup_timeout]]
  - name: asset_entry
    fields: [[u8, width], [u8, height], [u16, zero], [const u8 *, bits], [u32, frames]]
    notes: >
      bits points at the 1-bit-per-pixel rows in the image itself: 0xbc02c's
      word 0xecbac, which words.yaml had to declare by hand as a pointer before
      the table was known, holds 18 bytes that draw a cross for a 14 x 10 icon.
  - name: name_ptr
    fields: [[const char *, name]]
    notes: >
      a table of string pointers indexed by a small code, the shape every
      *_names table in the image has
  - name: flash_id
    fields: [[u32, jedec_id], ["u8[12]", params]]
    notes: params are not decoded; only jedec_id is matched

fixed_points:
  # Sections whose address is part of a contract with something outside the app,
  # so no layout may move them. Everything else in the image is free to go
  # wherever the linker puts it.
  - addr: 0x27000
    name: app_vector_table
    read_by: MBR, SoftDevice, bootloader
    notes: >
      The application's vector table. The SoftDevice forwards every interrupt
      through the table at the base it is given, the bootloader boots the app by
      reading the initial MSP and the reset entry from the first two words, and
      the linked library's port.c reads the same table for the main stack top.
      0x27000 is also the size field of the MBR/SoftDevice structure, which is
      why the app links there in the first place.
  - addr: 0xf1178
    name: fw_version_trailer
    read_by: bootloader, phone
    notes: >
      The u32 firmware version at the end of the image, preceded by the build
      string; get_fw_version (0x36e70) returns it and the WPP probe reply carries
      it, and tools/mkpkg.py rewrites it in place to build a package with a
      different version. FIRMWARE.md's update section is the evidence: a package
      that changes only this word and the header's version field installs and is
      reported back.
