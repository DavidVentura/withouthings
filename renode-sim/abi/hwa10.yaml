  - name: wpp_obj_BatteryVoltageMv_encode
    address: 0x9941a
    ret: void
    args: [[const struct wpp_BatteryVoltageMv *, obj], [void **, cursor]]
    notes: WPP object type 292 (BatteryVoltageMv)
  - name: wpp_obj_DebugDumpIgnoreData_encode
    address: 0x99440
    ret: void
    args: [[const struct wpp_DebugDumpIgnoreData *, obj], [void **, cursor]]
    notes: WPP object type 293 (DebugDumpIgnoreData)
  - name: wpp_obj_AlarmId_parse
    address: 0x4ef54
    ret: i32
    args: [[void **, cursor], [u16, len], [struct wpp_AlarmId *, out]]
    notes: WPP object type 294 (AlarmId)
