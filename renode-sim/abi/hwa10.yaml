  # --- WPP objects, in memory ---
  # One struct per wire object type, recovered by abi/protocol.py from the
  # codecs themselves: the encoder loads every field off r0 before handing it to
  # a cursor primitive, and the parser hands the primitive a pointer into r2, so
  # the offset and the width of each field are the instruction's own. Wire order
  # is what the conformance check already matched against wpp/src/objects.rs
  # field for field, which is what names them. Signedness is the encoder's
  # `ldrsb`/`ldrsh` where it has one; a four-byte load cannot say, so every
  # 32-bit field reads u32 here even where the crate calls it i32. The notes
  # carry the encoder and parser addresses and the site of every load or store.
  # Regenerate with:
  #   python3 abi/protocol.py --emit-structs-yaml /tmp/wppstructs.yaml
  - name: wpp_Null
    fields: []
    notes: >
      WPP object type 256 (Null), 0 bytes; encoder 0x9917a; encoder 0x9a918; parser 0x4ed90.
  - name: wpp_BatteryPercent
    fields: [[u16, percent]]
    notes: >
      WPP object type 263 (BatteryPercent), 2 bytes; encoder 0x99216 (+0x0@0x99236).
