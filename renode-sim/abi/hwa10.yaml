  - name: wpp_service_ctx
    fields: [[u32, pad0], [u16, wpp_v2_value], [u16, pad1], [u16, wpp_v2_cccd],
             [u16, pad2], [u16, wpp_v3_value], [u16, pad3], [u16, wpp_v3_cccd],
