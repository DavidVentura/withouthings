  # ---- dblib entry layouts ----------------------------------------------------
  # Recovered from the code that reads each entry back; one struct per information
  # element whose reader determines a layout. The enum of ids is under enums:.
  - name: dblib_calib_axis
    notes: >
      one axis of DBLIB_IE_ACCELERO_CALIB_MATRIX; the shell's `adxl calibrate <axis>`
      branch hands 0x3ca9c the three fields of one group as (u16*, i16*, i16*)
    fields:
      - [u16, gain]
      - [i16, offset_a]
      - [i16, offset_b]
  - name: dblib_query
    notes: >
      the cursor dblib_query_init fills in: 0x47b00 stores ie, len, -4, 0 and 0 at +0,
      +2, +4, +8 and +0xa, and 0x47b40 copies the whole thing with a three-word ldm/stm
    fields:
      - [u16, ie]
      - [u16, len]
      - [i32, cursor]
      - [u16, seq]
      - [u8, flags]
      - [u8, pad]
  - name: dblib_ie_macaddress
    notes: >
      DBLIB_IE 0x1: 0x36eb4 reads 0x12 bytes and strcpy()s a default over them on a
      miss, so the entry is a NUL-terminated string.
    fields:
      - ["char[18]", value]
  - name: dblib_ie_secret
    notes: >
      DBLIB_IE 0x3: 0x93256 reads 0x11 bytes and zeroes byte 0 on a miss, so the entry
      is a NUL-terminated string.
    fields:
      - ["char[17]", value]
  - name: dblib_ie_mfgid
    notes: >
      DBLIB_IE 0xb: 0x36ed8 reads 4 bytes into one word and returns it.
    fields:
      - [u32, value]
  - name: dblib_ie_accelero_calib_matrix
    notes: >
      DBLIB_IE 0x43: the shell's `adxl calibrate <axis>` branch at 0x3c9dc reads 0x12
      bytes and writes one of three identical six-byte groups at +0, +6 and +0xc.
    fields:
      - ["struct dblib_calib_axis[3]", axis]
  - name: dblib_ie_quartz_millihz
    notes: >
      DBLIB_IE 0x76: 0x34654 reads and writes 4 bytes through one word.
    fields:
      - [u32, value]
  - name: dblib_ie_session_nonce
    notes: >
      DBLIB_IE 0x99: 0x9326c reads 8 bytes and passes them whole to 0x59474.
    fields:
      - ["u8[8]", value]
  - name: dblib_ie_mcu_temp_cal
    notes: >
      DBLIB_IE 0xa5: 0x9abba copies the 0x20 bytes into two four-word arrays and the
      setter writes x[ch] and y[ch] for a channel ch it parses out of the request;
      0x53b78 interpolates between (x[0],y[0]) and (x[1],y[1]).
    fields:
      - ["u32[4]", x]
      - ["u32[4]", y]
  - name: dblib_ie_event_with_time
    notes: >
      DBLIB_IE 0xa7: 0x6ea20 enumerates 0x14-byte entries and keeps the one with the
      smallest first word, which it logs as a timestamp.
    fields:
      - [i32, timestamp]
      - ["u8[16]", payload]
  - name: dblib_ie_battery_cal
    notes: >
      DBLIB_IE 0xb5: 0x40014 reads 8 bytes into two words and shifts each right by
      three; dblib.py reads the pair as 4193 mV against 985 ADC counts.
    fields:
      - [u32, a]
      - [u32, b]
  - name: dblib_ie_cust
    notes: >
      DBLIB_IE 0xb8: 0x46b78 reads 4 bytes into one word and caches it behind a loaded
      flag.
    fields:
      - [u32, value]
  - name: dblib_ie_part_id
    notes: >
      DBLIB_IE 0xe3: 0x5a87c enumerates 0x16-byte entries, strcmp()s the first 16 bytes
      against the shell argument and logs the last six one byte at a time.
    fields:
      - ["char[16]", name]
      - ["u8[6]", value]
  - name: dblib_ie_alarm_slot
    notes: >
      DBLIB_IE 0x112: 0x944a0 enumerates 0x28-byte entries and matches the first byte
      against a slot index it refuses above 10.
    fields:
      - [u8, slot]
      - ["u8[39]", payload]
  - name: dblib_ie_tls_client_cert
    notes: >
      DBLIB_IE 0x12b: 0x974fc allocates 0x202 bytes, reads the entry into them, then
      copies der_len bytes from offset 2 as the certificate.
    fields:
      - [u16, der_len]
      - ["u8[512]", der]
  - name: dblib_ie_tls_client_keys
    notes: >
      DBLIB_IE 0x12c: 0x6d50c reads 0x40 bytes and passes them to ed25519_sign as the
      key; 0x974fc reads the same 0x40 into the TLS context.
    fields:
      - ["u8[64]", key]
  - name: dblib_ie_wpps_redirect
    notes: >
      DBLIB_IE 0x141: 0x55454 writes 0x50 bytes and wpps_build_sni 0x553b4 formats them
      with "%s.%s".
    fields:
      - ["char[80]", value]
  - name: dblib_ie_thresholds
    notes: >
      DBLIB_IE 0x146: 0x5e850 reads 0x34 bytes and copies all thirteen words out one at
      a time after matching the first against its argument.
    fields:
      - ["i32[13]", value]
  - name: dblib_ie_counter
    notes: >
      DBLIB_IE 0x149: 0x9ac8c enumerates 0xc-byte entries and matches the low byte of
      the first word against the counter id.
    fields:
      - [u32, key]
      - [u32, a]
      - [u32, b]
  - name: dblib_ie_reset_event
    notes: >
      DBLIB_IE 0x15b: 0x9add6 enumerates 0x2c-byte entries, matches byte 0 against its
      argument and sums seven halfwords starting at offset 2.
    fields:
      - [u8, kind]
      - [u8, pad]
      - ["u16[7]", count]
      - ["u8[28]", rest]
  - name: dblib_ie_greenteg_sensitivity_bin
    notes: >
      DBLIB_IE 0x16a: 0x4d728 reads one byte and falls back to 0x4a.
    fields:
      - [u8, value]
  - name: dblib_ie_ie_0x16e
    notes: >
      DBLIB_IE 0x16e: 0x67a20 reads 2 bytes and passes each as a signed byte to 0x9cfd2.
    fields:
      - ["i8[2]", value]
  - name: dblib_ie_crown_scale
    notes: >
      DBLIB_IE 0x16f: 0x491c0 reads 4 bytes and splits them into two halfwords its
      caller names the digital crown scale factor.
    fields:
      - [u16, a]
      - [u16, b]
  - name: dblib_ie_menstrual_cycle_info
    notes: >
      DBLIB_IE 0x170: 0x470dc enumerates 0x1c-byte entries into a word-indexed array
      (param_1 + i*7) and stops after three.
    fields:
      - ["u32[7]", field]
  - name: dblib_ie_menstrual_cycle_unk
    notes: >
      DBLIB_IE 0x174: 0x46ec8 enumerates 4-byte entries and compares the value against a
      time window.
    fields:
      - [u32, timestamp]
  - name: dblib_ie_greenteg_integration_factor
    notes: >
      DBLIB_IE 0x180: 0x4d8a8 builds the 0x10 bytes as byte 0 = 0x4a, two zero words and
      a float, memcmp()s them against the stored entry and writes on a difference.
    fields:
      - [u8, sensor]
      - ["u8[3]", pad]
      - [u32, a]
      - [u32, b]
      - [float, factor]
  - name: dblib_ie_inactivity_sample
    notes: >
      DBLIB_IE 0x181: 0x5ec34 enumerates 0xc-byte entries, sums the second word for the
      entries whose third word is inside a 24 h window.
    fields:
      - [u32, a]
      - [i32, minutes]
      - [u32, timestamp]


  # ---- the sensor-sync path: one 0x4c-byte slot shared by two streams --------
  - name: sensors_sync_stream
    fields: [[const char *, name], [u32, offset], [u32, size], [u8, field_c],
             ["u8[0x3]", pad_d]]
    notes: >
      the constant description of one of the two streams that share a sensor-sync
      slot; two of them, 0xb41cc {"PPG_CHANS", 0xc, 0x40, 0} and 0xb41dc
      {"ACC", 0, 0xc, 5}, reached through the two-entry pointer table at 0xb41c4
      that sensors_sync_ring_push indexes by sensor id. +0 is the %s of
      "[SENSORS_SYNC][%s] Sample lost !!!" (loaded at 0x59766) and of "Nothing to
      pop" (0x596c8). +4 and +8 are the byte range the stream owns inside the
      slot: the push adds +4 to the slot base and passes +8 as the memcpy length
      (0x597a6, 0x597ae), and the consumer zeroes exactly that range for a stream
      that is not subscribed with the same pair loaded as one `ldrd` (0x595f0,
      0x59606). +0xc is read once, only as `5 - x` into the ring's drop counter
      (0x598e2, 0x598f2), which is not enough to name it.
  - name: sensors_sync_ring
    fields: [[const struct sensors_sync_stream *, stream], [u16, wr], [u16, fill],
             [u8, refs], [u8, drop], ["u8[0x2]", pad_a]]
    notes: >
      the per-stream state of the shared ring, two of them at 0x20007124 (sensor
      id 0) and 0x20007118 (id 1), 0xc bytes apart. +0 is the stream description
      the log line and the memcpy length come from. +4 is the write index, bumped
      and wrapped at 0x80 after each push (0x597ba..0x597c6), and +6 the fill
      count bumped with it (0x597c8), decremented once per popped slot (0x5967c,
      0x59688) and cleared together with +4 by the single `str` at 0x598ac, which
      is what fixes them as two adjacent u16. +8 is a reference count:
      sensors_sync_ref_acquire increments it, sensors_sync_ref_release decrements
      it and refuses at zero, and both the push and the pop treat non-zero as
      "this stream is running". +9 is a drop countdown -- the push returns
      without storing while it is non-zero and decrements it (0x59746), and
      sensors_sync_restart is the only thing that loads it, from the stream's
      +0xc.
  - name: sensor_sample_accel
    fields: [[i16, x], [i16, y], [i16, z], [u16, reserved_6], [i32, abs_sum]]
    notes: >
      the 0xc bytes the "ACC" stream owns at offset 0 of a slot. The builder
      0x3bd10 walks the driver's 6-byte-per-entry sample array and writes the
      three axes to sp+0xc/0xe/0x10 (0x3bd6a, 0x3bd76, 0x3bd82), a literal zero
      to sp+0x12 (0x3bd92) and the sum of the three absolute values to sp+0x14
      (0x3bd86..0x3bd8e), then hands sp+0xc to sensors_sync_ring_push as sensor 0,
      and the stream's size says 0xc bytes travel. Both readers take the axes as
      signed halfwords at +0/+2/+4 (0x5f5e2..0x5f5ea, 0x5f618..0x5f620) and both
      copy the 6 bytes as one word plus one halfword (0x5f636..0x5f642, 0x3141e
      at 0x3143c..0x31440), which is a 3 x i16 struct assignment. Nothing reads
      +6 or +8.
  - name: sensor_sample_ppg
    fields: [["u32[0x10]", chan]]
    notes: >
      the 0x40 bytes the "PPG_CHANS" stream owns at offset 0xc of a slot: one
      word per MAX86173 channel, indexed by channel id -- 0x9ab06 switches on the
      id (`cmp r0,#0xf`) and hands back the address of the word (0x52410), and the
      expander 0x3141c reads all sixteen. Each word is a bit field, written by
      0x523cc and read by 0x3141c at the same positions: bits 0..19 are the
      20-bit FIFO datum, `bfi r2,r1,#0,#20` at 0x5242a against `sbfx r3,r3,#0,#0x14`
      at 0x31442; bits 20..28 and 29..30 are two values the producer packs into
      the upper halfword under the mask 0xffff800f (0x52466..0x5247e) and the
      consumer unpacks with `ubfx r0,r0,#4,#9` and `ubfx r1,r1,#5,#2` (0x3144a,
      0x31446) before turning the pair into one float through 0x28758; bit 31 is
      a flag stored as a byte by the consumer (0x3145e). The producer takes bits
      20..28 and 31 from the per-channel configuration at 0x2001af9c through
      0x51bcc and 0x51bf4, which is not enough to name any of the three.
  - name: sensors_sync_slot
    fields: [[struct sensor_sample_accel, acc], [struct sensor_sample_ppg, ppg]]
    notes: >
      one entry of the 128-slot ring at 0x2001d2d8; the stride 0x4c is the
      literal every walk of the buffer multiplies by (0x597a8 in the push,
      0x595ce and 0x59664 in the consumer, 0x30ee0 in the raw-data flush) and it
      is the sum of the two streams' offset and size.

  - name: algo_ppg_chan
    fields: [[i32, counts], [float, scale], [u8, flag], ["u8[0x3]", pad_9]]
    notes: >
      one MAX86173 channel as the algorithms see it, unpacked from the channel
      word of sensor_sample_ppg by sensors_sync_slot_to_algo: the sign-extended
      20-bit datum (`sbfx #0,#0x14`), the float 0x28758 makes out of the word's
      9-bit and 2-bit fields, and bit 31 as a byte. Sixteen unrolled copies of
      the same three stores, 0xc apart, fix the record (0x3144e..0x31464 is the
      first, 0x3169a..0x316aa the last).
  - name: algo_sample_frame
    fields: [[i16, x], [i16, y], [i16, z], [u16, pad_6],
             ["i32[0x3]", sel_counts],
             [float, sel_scale_0], [u8, sel_flag_0], ["u8[0x3]", pad_19],
             [float, sel_scale_1], [u8, sel_flag_1], ["u8[0x3]", pad_21],
             [float, sel_scale_2], [u8, sel_flag_2], ["u8[0x3]", pad_29],
             ["struct algo_ppg_chan[0x10]", chan]]
    notes: >
      what one sensors_sync slot becomes on its way to the algorithms, 0xec bytes
      -- sensors_sync_slot_to_algo zeroes it from +6 for 0xe6 (0x31422) and the
      accelerometer driver's own feed builds the same frame the same way
      (0x5f62a). The head is the three accelerometer axes, copied as one word
      plus one halfword, and then a three-slot selection the sixteen channel
      records are folded into: 0xa4418 copies channel 3 to slot 0, channel 13 to
      slot 1 and channel 6 to slot 2, each as its counts, its scale and its flag
      (0xa4418..0xa444a), and that is what fixes the split between the i32 array
      at +8 and the three scale/flag pairs at +0x14, +0x1c and +0x24. +0x2c is
      the sixteen algo_ppg_chan records, which ends the frame exactly at 0xec.

  # ---- the ECG session, and the HR algorithm's two ends ----------------------
  - name: ecg_session
    fields: [[u8, algo_version], [u8, state], [u8, prev_state], [u8, pad_3],
             [u32, adc_running], [i32, sample_count], [i32, repeats_remaining],
             [i32, stop_result], [u32, expected_evt_counter],
             [u32, dropped_buffers], [i32, field_1c], [i32, field_20],
             ["u8[0x4]", pad_24], ["u8[0x2450]", algo_ctx],
             ["i16[0x90]", sample_ring], [u16, ring_wr], [u8, ring_wrapped],
             [u8, pad_259b], ["u8[0xb30]", pad_259c],
             [i32, result_code], [u8, field_30d0], ["u8[0x3]", pad_30d1],
             ["u8[0x38]", algo_result],
             [void *, mutex], [void *, stop_done_sem], [void *, result_out],
             [i32, target_sample_count], [u8, cfg_mode], [u8, field_311d],
             [u8, cfg_stream], [u8, field_311f], [u8, cfg_raw_print],
             ["u8[0x3]", pad_3121], [const void *, callbacks]]
    notes: >
      one object at 0x20011668, 0x3128 bytes, reached through three literals --
      itself, +0x2000 (0x20013668, which is how the ring cursors are written) and
      +0x3000 (0x20014668, the handles and the configuration) -- and nothing
      outside the ECG module loads any of the three.
      +0 is the `%d` of "[ECG] algo version %d" (0x4a538) and is set to 2 at
      0x4a520. +1 is the state the 7-way `tbh` at 0x4a094 switches on and the
      only thing 0x49bb8 writes, which also saves the old value into +2; nothing
      reads +2. +4 is cleared and tested around the ADC start and stop (0x49c3c,
      0x4a1fc). +8 counts samples in steps of 0x32 (0x49f54) and is compared
      against +0x3118 (0x49f4a). +0xc is the repeat counter, initialised to -1
      (0x4a746) and decremented at 0x4a482. +0x10 is the `result = %d` of the
      stop line (0x49c90), +0x14 the "expected evt" counter and +0x18 the
      `%u` of "Nb dropped buffers" (0x49c9c). +0x1c and +0x20 are written once
      each (0x4a19c, 0x4a1ba, the latter from dblib id 0x11f) and read nowhere
      that names them.
      +0x28 is an embedded algorithm object: 0x4a52c initialises it as
      (base+0x28, 300, 1610) and every later use passes the same address; the
      loads at +0x6c, +0xcc8 and +0xd08 are inside it.
      +0x2478 is a 144-entry i16 ring with its write index at +0x2598 (wrapped at
      0x90 at 0x49d24 and 0x4a04e) and a wrapped flag at +0x259a, all three
      written through the +0x2000 literal.
      +0x30cc is the `%d` of the result line (0x4a400), +0x30d4 the 14-word block
      the algorithm's own result accessor fills (`ldm`/`stm` at 0x4a342..0x4a358)
      and out of which four floats and one word are read at 0x4a364..0x4a37a.
      +0x310c is the module mutex, created by xQueueCreateMutexStatic at 0x4a736
      over the storage at 0x2001924c and taken with a 500-tick timeout by the
      task and by every entry point; +0x3110 is a one-slot semaphore created
      only for the duration of ecg_task_stop (0x4a620, deleted at 0x4a678).
      +0x3114..+0x3124 are the five configuration words ecg_acquisition_start
      copies in one block from its argument (0x4a54c..0x4a562): a 0x68-byte
      result buffer, a sample target that is -1 for unlimited, two words the
      image only ever reads a byte at a time, and a table of six function
      pointers (called at +0, +4, +8, +0xc, +0x10 and +0x14). Of those bytes
      +0x311c is only ever compared against 2, +0x311e gates every path that
      emits samples and +0x3120 selects the per-sample "%d" dump; +0x311d and
      +0x311f gate paths that leave more than one reading.
  - name: hr_algo_result
    fields: [["u8[0x230]", filters], [u32, window_samples],
             [void *, buf_a], [void *, buf_b], [void *, buf_c],
             [u8, bpm], [u8, bpm_ref], [u8, ready], [u8, acceptable],
             [u8, quality], [u8, warm], ["u8[0x2]", pad_246], [i32, status]]
    notes: >
      the HR algorithm's own result block at 0x2000f480, which is its object's
      +0x2c84; 0x7aa60 is the only writer of the tail and 0xa2548 the only
      reset. The head is four filter states (three of 0xa8 for the three selected
      PPG channels, one of 0x38 that also takes the accelerometer, initialised
      and stepped in that order at 0x7aa7a..0x7aa9e) whose ready bytes are ANDed
      into +0x245 at 0x7aade. +0x234..+0x23c are three 0x98-byte float buffers,
      the size taken from the memsets at 0xa25b2..0xa25c0. +0x240 is the beats
      per minute, a `vcvt.u32.f32` stored at 0x7ac6c, and the same byte is read
      through the object base as +0x2ec4 at 0xa24fa, which is what fixes the
      block's offset inside the object. +0x241 is the reference the plausibility
      test at 0x7ac84 measures against, +0x242 the ready mirror, +0x243 the flag
      the acceptance test at 0x7ac98..0x7acec produces, +0x244 the quality
      0x74494 returns and +0x248 the status: 0 on success, -3 for too few
      samples (0xa257c, 0x7acfa) and -6 for a failed sub-step (0x7aba4). The
      reader 0xa265c copies +0x240..+0x244 out and returns +0x248.
  - name: hr_algo_report
    fields: [[u8, updated], [u8, hr_store], [u8, hr_live], [u8, field_3],
             [u8, worn], [u8, field_5], [u8, field_6],
             [u8, bpm], [u8, bpm_ref], [u8, ready], [u8, acceptable],
             [u8, quality]]
    notes: >
      the twelve bytes the algorithm manager builds on its stack and hands to the
      HR consumer, and the only call of that consumer is 0x64072, so the layout
      is forced from both sides. The publisher zeroes all twelve (0x63fc4,
      0x63fc8), writes +0 to 1, +1 and +2 from the two beat rates the log lines
      call `hr_store: %dbpm` and `hr_live: %dbpm` (0x62624, 0x62622), +4 from the
      worn flag the `worn:%s` line prints (0x63fca, 0x62620) and +7..+0xb as one
      five-byte copy of hr_algo_result's +0x240..+0x244 (0x63fe4). The consumer
      gates its whole burst block on +9 (0x626ba), prints +0xa as
      `Notifiable: %s` and stores +7 into the HR context's last result. +3, +5
      and +6 are written only on the path taken when one algorithm is disabled
      (0x64124, 0x64130, 0x6406e), which is not enough to name them.
  - name: hr_measure_ctx
    fields: [[u8, mode], [u8, mode_1_requested], [u8, mode_2_requested],
             [u8, field_3], [u8, field_4], [u8, field_5], [u8, auto_burst_armed],
             [u8, pad_7], [u32, measure_start_uptime], [u32, non_storable_count],
             [u8, vasistas_stored], ["u8[0x3]", pad_11],
             [i32, sdnn], [i32, rmssd], [i8, hrv_quality], ["u8[0x3]", pad_1d],
             [u32, window_start_uptime], [i32, rr_interval], [i8, rr_censored],
             ["u8[0x3]", pad_29], [u32, rr_uptime], [u8, last_bpm],
             ["u8[0x3]", pad_31], [void *, timer]]
    notes: >
      the HR_MEASURE module's own state at 0x20020004, every field of which is
      printed by one of its log lines or read by the WPP handler. +0 is the mode
      the `BURST`/`CONTINUOUS` selection at 0x62670 switches on (1 and 2 are
      burst, 3 and 4 continuous, from the range tests at 0x6269a and 0x62a66) and
      +1 and +2 are the two requests that set it. +8 is the uptime a measurement
      started at, subtracted at 0x626d0 to give its duration, and +0xc the
      counter the "Limit reached (non storable samples count = %u / %d)" line
      compares against 0x2c. +0x14, +0x18 and +0x1c are the `sdnn: %ld`,
      `rmssd: %ld` and quality the three HRV getters return (0x62686, 0x6268e,
      0x62698), and +0x24 and +0x28 the `rr:` and `is_censored:` the two RR
      getters return (0x628bc, 0x628d2). +0x30 is the byte the WPP handler
      answers CMD_HR_MEASURE with: written from hr_algo_report's bpm at 0x62746,
      read at 0x62560 and refused when zero. +0x34 is the measurement timer
      0x623a2 creates. 0x62040 clears +8, +0xc, sixteen bytes from +0x14, +0x24,
      +0x28 and +0x2c.
  - name: hr_screen_data
    fields: [[u8, live_valid], [u8, live_bpm], ["u8[0x2]", pad_2],
             [u32, live_uptime], [u8, pad_8], [u8, burst_bpm],
             ["u8[0x2]", pad_a], [u32, burst_uptime]]
    notes: >
      sixteen bytes at 0x2001fff4 that the watch face reads and nothing else
      writes: the live rate and its validity as one halfword (cleared together by
      the `strh` at 0x62064, set at 0x621ae and 0x621b2) with the uptime it was
      taken at, and the same pair for the last burst result (0x62984, 0x6298a).
      0x624b0 hands the whole block out under the module lock.

tables:
  - name: wpp_cmd_table
    address: 0x274b4
    entry: wpp_cmd_entry
    stride: 12
    count: 148
    notes: >
      master-request dispatch: the commands the phone sends. Runs 0x274b4 to
      0x27ba4, not to 0x27c04: the dispatcher at 0x6c784 and the send path's
      name lookup at 0x6bdbe both load the pair (0x274b4, 0x27ba4) and step by
      12 between them, and the eight rows above 0x27ba4 are walked by a
      different dispatcher (0x6e788) that loads (0x27ba4, 0x27c04) and calls its
      handler with three arguments instead of two. They are declared separately
      as wpp_cmd_table_slave. The rows themselves have the same shape either
      way, which is why a walk by shape alone reads the two as one table of 156; an earlier reading started it at 0x27994, which is row 104, not
      the head. abi/autonames.py walks it in both directions from there and
      stops where the row stops being {command id, odd handler in the image,
      pointer to a printable name}; the row above the head belongs to the
      shell's own table (0x27100, 79 rows, a different shape: the command word
      first and two entry points after it). Each row's name string is the handler's
      source name, which is where abi/autonames.yaml's wppcmd class comes from.
      No literal-pool reference to the table exists in the image, so the walker
      reaches it some other way; replacing a handler word in place works
      regardless (proven by diverting the battery handler to a logging hook).
  - name: wpp_cmd_table_slave
    address: 0x27ba4
    entry: wpp_cmd_slave_entry
    stride: 12
    count: 8
    notes: >
      The eight rows above wpp_cmd_table, dispatched by 0x6e788 rather than
      0x6c784. Both bounds are its own literal pool pair (0x6e7d4 and 0x6e7d8,
      repeated at 0x6e830/0x6e834), it logs "[WPP][<-]"-style lines with the
      row's name from +8 like the master walk, and it tail-calls the handler at
      +4 as `bx r3` after loading three arguments, so these handlers have a
      different prototype from the master-request ones. In address order the
      commands are SYNC_REQUEST 321, LOCAL_EVENT_NOTIFY 2459, MEASURE_STOP 2420,
      MEASURE_START 2419, NOTIFICATION_GET 2404, GLYPH_GET 2403,
      WORKOUT_STOP 318 and WORKOUT_START 317.
  - name: shell_cmd_table
    address: 0x27100
    entry: shell_cmd_entry
    stride: 12
    count: 79
    notes: >
      the UART debug console's dispatch, sorted by command word so the walk can
      stop early. Head and end are the pair of literal-pool words every reader
      loads (0x27100 and 0x274b4 at 0x59cb8, 0x5a020, 0x5a134 and 0x5a270), and
      the stride is the reader's own `adds r5, #0xc` / `ldr r1, [r4], #12`; the
      end is where wpp_cmd_table begins, so the two tables abut. An earlier
      reading put the head at 0x270f8, which is inside the vector table and
      shifted every row's name onto the previous row's handler.
  - name: i2c_device_table
    address: 0xb22c4
    entry: i2c_device
    stride: 28
    count: 7
  - name: spi_device_table
    address: 0xb2438
    entry: spi_device
    stride: 20
    count: 2
    notes: >
      The two SPIM2 devices, the external flash (cs_pin 0x000f0000) and the
      ADXL367 (0x00100000); cs_pin is the {u16 port, u16 pin} pair the gpio_pin
      table uses, so those read as P0.15 and P0.16. An earlier reading put the
      table at 0xb23c0 with three rows, which is wrong: 0xb23c0 and 0xb2404 are
      two more devices of the same shape (max86173 on SPIM1 CS P0.26 and the
      device on CS P0.25) but they are not contiguous with each other or with
      this pair, because each one's bus descriptor sits between them (0xb23c0's
      bus is 0xb23d4, which holds SPIM1's 0x40004000 at 0xb23f4, the address
      symbols.txt calls spi1_cfg). At stride 20 from 0xb23c0 the second row
      would start inside that bus descriptor and its name field would be
      0xb23ec, which is not a string.
  - name: gpio_pin_table
    address: 0xbe470
    entry: gpio_pin
    stride: 4
    count: 24
    notes: >
      symbols.txt puts this at 0xbe458; that is 0x18 too low. 0xbe458..0xbe46f
      are the three ble_gap_conn_params_t (12,12,{0,15,30},600) FIRMWARE.md
      describes. The {port,pin} descriptors start at 0xbe470, which is what
      makes 0xbe478 = {1,13} (crown MOTION) and 0xbe4c8 = {1,11} (click).
  - name: ble_conn_params_table
    address: 0xbe458
    entry: ble_gap_conn_params
    stride: 8
    count: 3
  - name: asset_table
    address: 0xbbf50
    entry: asset_entry
    stride: 12
    count: 70
    notes: >
      The image assets the UI draws. 70 rows of {u8 width, u8 height, u16 zero,
      const void *bits, u32 frames}, 0xbbf50..0xbc298, whose bits run
      0xeba84..0xee6xx in internal flash -- so the app does carry bitmaps, which
      is what the absence of a grid over this run hid. The extent is the run
      itself: below 0xbbf50 the bytes are an array of 0x64, at 0xbc298 a
      different object starts whose first word points back into itself, and 40
      literal-pool words name rows of the table and nothing between them. width
      is settled by the drawing routine 0x84878, whose first instruction is
      `ldrb r5,[r2,#0]` followed by `rsb r5,r5,#144`, halved and added to the x
      argument: the panel is 144 wide and the asset is centred on it. frames is
      settled by the offsets: where the asset is uncompressed the distance to
      the next row's offset is exactly width * height * frames / 8 (row 0 is
      44 x 58, four frames, 1276 bytes). Without the grid the pool words naming
      rows read as numbers and the 70 bits pointers read as numbers too, so a
      layout that moved the bitmaps would have left every one of them stale.
  - name: bq25180_reg_names
    address: 0xb2674
    entry: name_ptr
    stride: 4
    count: 13
    notes: >
      The firmware's own name for every BQ25180 register, indexed by register
      address 0x00..0x0c. The shape is a pointer table, not the char[12] array
      the right-padded strings suggest: the reader at 0x435d2 loads this address
      and does `ldr r2, [r2, r4, lsl #2]` with r4 the register number, and the
      strings it points at are scattered (STAT0 0xd48f8, ICHG_CTRL 0xd4954 and
      CHARGECTRL1 0xd4979 sit among the log formats that also name them, the
      other ten run 0xd4a30..0xd4aa8). The names are padded to 11 columns
      because they are printed in one aligned column by the shell's `dump`.
      0xb2674 is where the run of string pointers starts and 0xb26a8 is where it
      stops; the four pointers below it are ble_state_names. Three call sites
      index it: 0x43600 (the register dump), 0x436ac and 0x43770/0x43784, all of
      which report through "[BQ25180] error reading %s" (0xd4917).
  - name: bq25180_charge_status_names
    address: 0xb2664
    entry: name_ptr
    stride: 4
    count: 4
    notes: >
      the four colourised strings the "[BQ25180] CHG = %hu, %s" line selects
      between at 0x439fc, indexed by STAT0's two-bit CHG field: not charging,
      constant current, constant voltage, done/disabled
  - name: ble_state_names
    address: 0xb2654
    entry: name_ptr
    stride: 4
    count: 4
    notes: >
      BLE_STOP, BLE_SYNC_REQUEST, BLE_NORMAL, BLE_END; loaded by 0x40b38,
      0x40b94, 0x40bc4 and 0x40c2c, and bounded below by a non-pointer word
  - name: max86173_channel_names
    address: 0xb411c
    entry: name_ptr
    stride: 4
    count: 25
    notes: >
      the MAX86173 measurement channels by name (PPG_AFIB, HR_LOW, HR_HIGH,
      INACTIVITY, PPG_AFIB_NIGHT, then the twenty LED/photodiode pairings and
      the four ambient ones), loaded once at 0x518f4; the word below the run is
      zero and the word above is not an address
  - name: adxl367_mode_names
    address: 0xb47f0
    entry: name_ptr
    stride: 4
    count: 4
    notes: >
      OFF, BURST_AUTO_STOP, BURST_MANUAL_STOP, CONTINUOUS -- the measure modes
      "[ADXL367] Set mode %d" counts; loaded at 0x62320
  - name: afib_class_names
    address: 0xb4824
    entry: name_ptr
    stride: 4
    count: 5
    notes: >
      UNDEFINED, NSR, AFIB, OTHER, NOISE -- the AFib classifier's verdicts,
      loaded at 0x63570 and 0x63608
  - name: flash_id_table
    address: 0xb427c
    entry: flash_id
    stride: 16
    count: 28

table_structs:
  - name: fwblk_table
    fields: [[u32, payload_offset], [u32, len], [void *, body]]
    notes: >
      what fwblk_table_parse fills at 0x4cb5c..0x4cb66: the external-flash
      offset of the payload (the header offset plus 4), the u16 length from the
      header widened to a word, and the buffer holding header + payload + CRC32
  - name: wpp_cmd_entry
    fields: [[u32, command], [wpp_cmd_handler, handler], [const char *, name]]
    notes: >
      handler has the Thumb bit set and name points at the handler's source
      name; abi/autonames.py walks the table on exactly that shape. The
      dispatcher 0x6c784 loads the row's +0 as a u16 to compare and its +4 as
      the call target, so command is only ever read sixteen bits wide.
  - name: wpp_cmd_slave_entry
    fields: [[u32, command], [wpp_cmd_slave_handler, handler], [const char *, name]]
    notes: >
      the same three words as wpp_cmd_entry, which is why a walk by shape alone
      reads the two tables as one; the difference is the dispatcher, and so the
      handler's prototype.
  - name: shell_cmd_entry
    fields: [[const char *, name], [shell_cmd_run, run], [shell_cmd_help, help]]
    notes: >
      both entry points carry the Thumb bit as stored. The walk at 0x5a224
      strcmps the argument against +0, calls +4 with (argc, argv), and calls +8
      instead when any argument is "--help" (0x5a278).
  - name: i2c_device
    fields: [[void *, bus], [u32, addr], [u32, unknown], [void *, fn0],
             [void *, fn1], [void *, fn2], [void *, fn3]]
  - name: spi_device
    fields: [[void *, bus], [u32, cs_pin], [u32, mode], [u32, state], [const char *, name]]
  - name: gpio_pin
    fields: [[u16, port], [u16, pin]]
  - name: ble_gap_conn_params
    fields: [[u16, min_conn_interval], [u16, max_conn_interval],
             [u16, slave_latency], [u16, conn_sup_timeout]]
  - name: asset_entry
    fields: [[u8, width], [u8, height], [u16, zero], [const u8 *, bits], [u32, frames]]
    notes: >
      bits points at the 1-bit-per-pixel rows in the image itself: 0xbc02c's
      word 0xecbac, which words.yaml had to declare by hand as a pointer before
      the table was known, holds 18 bytes that draw a cross for a 14 x 10 icon.
  - name: name_ptr
    fields: [[const char *, name]]
    notes: >
      a table of string pointers indexed by a small code, the shape every
      *_names table in the image has
  - name: flash_id
    fields: [[u32, jedec_id], ["u8[12]", params]]
    notes: params are not decoded; only jedec_id is matched

fixed_points:
  # Sections whose address is part of a contract with something outside the app,
  # so no layout may move them. Everything else in the image is free to go
  # wherever the linker puts it.
  - addr: 0x27000
    name: app_vector_table
    read_by: MBR, SoftDevice, bootloader
    notes: >
      The application's vector table. The SoftDevice forwards every interrupt
      through the table at the base it is given, the bootloader boots the app by
      reading the initial MSP and the reset entry from the first two words, and
      the linked library's port.c reads the same table for the main stack top.
      0x27000 is also the size field of the MBR/SoftDevice structure, which is
      why the app links there in the first place.
  - addr: 0xf1178
    name: fw_version_trailer
    read_by: bootloader, phone
    notes: >
      The u32 firmware version at the end of the image, preceded by the build
      string; get_fw_version (0x36e70) returns it and the WPP probe reply carries
      it, and tools/mkpkg.py rewrites it in place to build a package with a
      different version. FIRMWARE.md's update section is the evidence: a package
      that changes only this word and the header's version field installs and is
      reported back.
# ---- dblib, the settings store on the external MX25R ------------------------
