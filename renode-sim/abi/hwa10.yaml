  # ---- the sensor-sync path ---------------------------------------------------
  - name: sensors_sync_streams
    address: 0xb41c4
    type: "const struct sensors_sync_stream *[0x2]"
    notes: >
      indexed by sensor id after the `cmp r0,#1` that refuses anything else
      (0x59718, 0x59804, 0x59838); entry 0 is the accelerometer, entry 1 the PPG,
      which the copy lengths fix -- the accel builder hands over a 0xc-byte stack
      struct as sensor 0 and the PPG builder a 0x40-byte one as sensor 1.
