  - name: wpp_obj_ProbeChallenge_encode
    address: 0x993be
    ret: void
    args: [[const struct wpp_ProbeChallenge *, obj], [void **, cursor]]
    notes: WPP object type 290 (ProbeChallenge)
  - name: wpp_obj_ProbeChallenge_parse
    address: 0x4eee4
    ret: i32
    args: [[void **, cursor], [u16, len], [struct wpp_ProbeChallenge *, out]]
    notes: WPP object type 290 (ProbeChallenge)
  - name: wpp_obj_ProbeChallengeResponse_encode
    address: 0x993f4
    ret: void
    args: [[const struct wpp_ProbeChallengeResponse *, obj], [void **, cursor]]
    notes: WPP object type 291 (ProbeChallengeResponse)
  - name: wpp_obj_ProbeChallengeResponse_parse
    address: 0x4ef24
    ret: i32
    args: [[void **, cursor], [u16, len], [struct wpp_ProbeChallengeResponse *, out]]
