    args: [[void *, rr]]
    notes: one load whose result is hr_measure_ctx.rr_interval and the `rr:` line's value.
  - name: rr_get_is_censored
    address: 0xa0bf8
    ret: i8
    args: [[void *, rr]]
    notes: >
      one load whose result is hr_measure_ctx.rr_censored, the value the
      "is_censored: %s" line prints.

  - name: rre_font_draw_glyph
    address: 0x34df0
    supersedes: rre_fonts_unsupported_font_type
    ret: u32
    args: [[i32, x], [i32, y], [i32, code], [i32, x_offset]]
    notes: >
      the whole of RRE_FONTS. The glyph is a run of big-endian-free 16-bit words
      taken from the font's data block between offset_table[code - first] and
      offset_table[code - first + 1] (0x34e5c), and each word is one filled
      rectangle: bits 0..3 are the x offset, bits 4..7 the y offset, bits 8..11
      the width minus one and bits 12..15 the height minus one (0x34e88..0x34ea8),
      clipped against the current window and handed to the blit callback as
      (x, y, w, h, colour). The switch on the font descriptor's first byte has
      seven arms, which is what the "unsupported font type" line it took its
      derived name from guards.
  - name: rre_font_glyph_width
    address: 0x34a80
    ret: u32
    args: [[i32, code]]
    notes: >
      the pixel width of one glyph and nothing else: it reads the same descriptor
      rre_font_draw_glyph does, returns the fixed advance at +6 (divided by three
      for the proportional arms) or walks the same offset table to measure the
      glyph, and calls nothing. rre_font_draw_glyph calls it once before it draws.
