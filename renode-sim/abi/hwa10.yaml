  # ---- dblib, the settings store on the external MX25R -------------------------
  - name: dblib_get
    address: 0x48294
    ret: i32
    args: [[u16, ie], [void *, buf], [u16, len]]
    notes: >
      one information element into the caller's buffer. The body builds a
      dblib_query on its stack (strh r0 at +0, strh r2 at +2, -4 at +4, zeros at
      +8 and +0xa, 0x482a2..0x482ca) and hands it to the store walk at 0x975ca
      with the caller's buffer in r2; 2 when the store is not initialised
      (0x482ee), 0 on a hit.
  - name: dblib_set
    address: 0x47df0
    ret: i32
    args: [[u16, ie], [const void *, buf], [u16, len]]
    notes: >
      the blob setter: passes (ie, buf, len, 0) to the common writer 0x475c4,
      whose fifth argument is a value-kind tag the other setter wrappers vary
      (0x47e58 and 0x480f0 pass 1, 0x47f58 and 0x4814c pass 2).
  - name: dblib_query_init
    address: 0x47b00
    ret: i32
    args: [[struct dblib_query *, q], [u16, ie], [u16, len]]
    notes: >
      opens a cursor over every entry stored under one id. Stores ie, len, -4, 0
      and 0 into the twelve-byte descriptor at 0x47b12..0x47b20.
  - name: dblib_query_next
    address: 0x47b8c
    ret: i32
    args: [[struct dblib_query *, q], [void *, buf]]
    notes: >
      the next entry the cursor reaches into buf, non-zero when the cursor runs
      out; every enumerating caller loops on `== 0`.
  - name: dblib_query_end
    address: 0x47b64
    ret: i32
    args: [[struct dblib_query *, q]]
    notes: closes the cursor; 0x472ac under the same lock dblib_query_init takes.
  - name: dblib_get_first
    address: 0x9776e
    ret: i32
    args: [[u16, ie], [void *, buf], [u16, len]]
    notes: >
      dblib_query_init, one dblib_query_next, dblib_query_end, returning the
      next's result; the whole body is those three calls.
  - name: dblib_count
    address: 0x97746
    ret: i32
    args: [[u16, ie]]
    notes: >
      how many entries are stored under one id: a cursor opened with length 0 and
      drained with a null buffer, counting the iterations.

  # ---- roles read off the bodies of the modules that carry no log tag ----------
  # Only where the body leaves one reading. SENSORS_SYNC, ECG and RRE_FONTS log
  # under a single tag and carry no __func__, so a name here comes from what the
  # function does to the structures it touches, not from a string.
  - name: sensors_sync_ring_push
    address: 0x59718
    ret: i32
    args: [[u32, sensor], [const void *, sample], [u32, arg2], [u32, arg3]]
    notes: >
      one sample into one of the two sensor rings. The body indexes a two-entry
      table of ring descriptors by the first argument and refuses anything above
      one (0x5971e), memcpys the sample into slot (write index * 0x4c) of the
      ring's buffer (0x597a0), advances the write index modulo 128 (0x597ac) and
      increments the fill count; when the reader's index has caught up it logs
      an overrun and drops the oldest slot instead. A ring with a write index, a
      wrap and a fill count is a push and nothing else.
  - name: sensors_sync_ref_acquire
    address: 0x597f8
    supersedes: sensors_sync_unsupported_sensor_type
    ret: i32
    args: [[u32, sensor]]
    notes: >
      increments the byte at +8 of the same ring descriptor under the same lock
      sensors_sync_ref_release decrements it under, having refused a sensor index
      above one. The logline name it takes over is the panic path for a bad index.
  - name: sensors_sync_ref_release
    address: 0x5982c
    ret: i32
    args: [[u32, sensor]]
    notes: >
      decrements the byte at +8 sensors_sync_ref_acquire increments, refusing at
      zero with an error rather than wrapping (0x59840); an increment and a
      decrement over one byte with an underflow refusal is a reference count.
      Its caller outside the module is adxl367_continuous_measure_mode.
  - name: sensors_sync_lock
    address: 0x59574
    ret: i32
    notes: >
      `xQueueSemaphoreTake(sensors_sync_mutex, 0xffffffff)` and nothing else; the
      handle is the one 0x59700 created and the only other user is
      sensors_sync_unlock.
  - name: sensors_sync_unlock
    address: 0x59560
    ret: i32
    notes: >
      `xQueueGenericSend(sensors_sync_mutex, 0, 0, 0)`, the give that pairs with
      every sensors_sync_lock in the module.
  - name: sensors_sync_mutex_init
    address: 0x59700
    ret: void
    notes: >
      the only writer of sensors_sync_mutex: xQueueCreateMutexStatic over the
      static storage at 0x2001d280, called from INIT at 0x2e4a2 just before the
      flush callback is installed.
  - name: sensors_sync_set_flush_cb
    address: 0x59880
    ret: void
    args: [[sensors_sync_flush_fn, cb]]
    notes: >
      a single store into sensors_sync_flush_cb; the word it writes is only ever
      read by the `blx` in sensors_sync_drain, so the argument is that callback
      and nothing else.
  - name: sensors_sync_drain
    address: 0x59584
    supersedes: sensors_sync_nothing_to_pop
    ret: void
    notes: >
      the consumer side of the ring, and the reason the two streams are one. It
      takes the lock, reads each subscribed ring's fill count and keeps the
      smaller of the two (0x595a2), so the slower stream sets the pace; over that
      many slots from sensors_sync_rd it zeroes, in each slot, the byte range of
      any stream that is not subscribed or has nothing pending (0x595ec,
      0x59602, using the stream's offset and size as one `ldrd`) and hands each
      contiguous run to sensors_sync_flush_cb (0x59636); it drains
      sensors_sync_exception_flags into 0x31410 (0x5964c); then it pops one slot
      at a time -- decrementing each subscribed ring's fill count, logging
      "Nothing to pop" if one is already empty, memcpying the 0x4c bytes to the
      stack and advancing sensors_sync_rd modulo 128 -- and hands each to
      sensors_sync_slot_to_algo (0x596b6). The derived name it takes over is one
      of its two error logs.
  - name: sensors_sync_reset
    address: 0x5988c
    ret: void
    notes: >
      drains what is pending (0x5989a) and then, under the lock, zeroes
      sensors_sync_rd and both rings' write index and fill count with one word
      store each (0x598a6..0x598b0), and sets bit 0 of
      sensors_sync_exception_flags. Clearing every cursor of both rings and the
      shared read index is a reset and leaves no other reading.
  - name: sensors_sync_restart
    address: 0x598d4
    ret: void
    notes: >
      the only writer of either ring's drop countdown: for each subscribed ring
      it stores `5 - ring->stream->field_c` into +9 (0x598e2, 0x598f2), so the
      accelerometer drops nothing and the PPG drops five samples, then restarts
      the sampling clock. It touches no other field.
  - name: sensors_sync_slot_to_algo
    address: 0x3141c
    supersedes: sensors_sync_nothing_to_pop__1
    ret: void
    args: [[const struct sensors_sync_slot *, slot]]
    notes: >
      the only reader of a whole slot, and the only thing that gives the bit
      fields of sensor_sample_ppg a meaning. It zeroes a 0xec-byte frame, copies
      the three accelerometer axes into its head as one word plus one halfword
      (0x3143c..0x31440), and for each of the sixteen channel words emits a
      0xc-byte record -- the sign-extended 20-bit datum, the float 0x28758 makes
      out of the 9-bit and 2-bit fields, and bit 31 as a byte -- then hands the
      frame to 0x64214. Sixteen identical unrolled expansions of one struct field
      is what names it; the derived name it takes over came from the caller's log
      line.
  - name: sensors_sync_push_accel
    address: 0x3bd10
    ret: void
    notes: >
      builds a sensor_sample_accel and pushes it as sensor 0. It walks the
      driver's sample array six bytes at a time (0x3bdc0), writes the three axes
      with one of them negated, the literal zero and the sum of the three
      absolute values into a 0xc-byte stack struct, and calls
      sensors_sync_ring_push with r0 = 0 (0x3bda2). Three i16 reads filling the
      accel sample is the whole body.
  - name: sensors_sync_push_ppg
    address: 0x523cc
    ret: void
    notes: >
      builds a sensor_sample_ppg and pushes it as sensor 1. It memsets 0x40 bytes
      (0x523e2), walks the measurement's channel list, asks 0x9ab06 for that
      channel's word inside the sample and packs the caller's 20-bit datum and
      the channel configuration's two upper fields into it, then calls
      sensors_sync_ring_push with r0 = 1 (0x523f6). The 0x40-byte buffer and the
      channel-indexed slot are the PPG stream's size and layout.
  - name: ppg_sample_channel_slot
    address: 0x9ab06
    ret: i32
    args: [[u32, channel], [struct sensor_sample_ppg *, sample], [u32 **, slot]]
    notes: >
      a `tbb` switch on the channel id, refusing above 0xf, whose every arm
      returns the address of that channel's word in the caller's PPG sample; it
      is what fixes sensor_sample_ppg as sixteen words indexed by channel id.

  - name: algo_frame_select_channels
    address: 0xa4418
    ret: i32
    args: [[struct algo_sample_frame *, frame]]
    notes: >
      nine copies and nothing else: channel 3's counts, scale and flag into the
      frame's first selection slot, channel 13's into the second and channel 6's
      into the third, in place. It is what fixes the frame head's three-slot
      shape and the three channels the algorithms actually use.
  - name: algo_enabled
    address: 0x7d4c0
    ret: u8
    args: [[u32, algo]]
    notes: >
      one byte read out of a global table indexed by the algorithm id, and every
      caller is a gate in algo_dispatch_sample.
  - name: algo_dispatch_sample
    address: 0x7d4f0
    ret: void
    args: [[void *, ctx], [struct algo_sample_frame *, frame]]
    notes: >
      hands one frame to each enabled algorithm: it folds the selected channels
      in (0x7d4fe), then for each of the ids 9, 8, 0xc, 7, 3, 4 and the rest asks
      algo_enabled and, if it answers, calls that algorithm with a fixed slice of
      the one context in r0 and the frame in r1 (0x7d506..0x7d5a4 and on). A
      per-id enable test in front of a per-id call is the whole body.
  - name: ecg_acquisition_start
    address: 0x4a4d8
    ret: i32
    args: [[const void *, cfg]]
    notes: >
      takes the ECG mutex at +0x10c, moves the state byte to 2, copies the nine
      words of the caller's configuration into the module's own globals
      (0x4a534..0x4a548), requests the high-frequency clock through the
      SoftDevice (svc 66 at 0x4a558) and posts state 1; its callers outside the
      module are the shell's ecg command and the WPP measure-start helper.
  - name: ecg_acquisition_stopped
    address: 0x49c74
    ret: void
    notes: >
      the other half: releases the high-frequency clock (svc 67 at 0x49cba),
      clears the handle at +0x10 the start set and posts state 0. It is the only
      hfclk release in the module and pairs with the one request.
  - name: ecg_task_stop
    address: 0x4a5e8
    ret: i32
    notes: >
      creates a one-slot semaphore, posts state 6 to the ECG task, blocks on that
      semaphore until the task acknowledges, then deletes it and drops the mutex;
      its caller outside the module is WPP_CMD_MEASURE_STOP.
  - name: ecg_set_state
    address: 0x49bb8
    ret: void
    args: [[u8, state]]
    notes: >
      the only writer of ecg_session.state: it saves the old value into
      prev_state and notifies the ECG task with 0x200 (0x49bc6). Every state
      transition in the module goes through it.
  - name: ecg_get_algo_version
    address: 0x4a870
    ret: u8
    notes: one load of ecg_session.algo_version, the `%d` of "[ECG] algo version %d".
  - name: ecg_is_active
    address: 0x4a6bc
    ret: bool
    notes: returns ecg_session.state != 0 and touches nothing else.
  - name: ecg_is_measuring
    address: 0x4a5d4
    ret: bool
    notes: >
      returns ecg_session.state > 1; its two callers use it as the "in progress"
      gate, one of them in front of "Cancel called while ECG is not in progress".
  - name: ecg_get_progress_percent
    address: 0x4a768
    ret: i32
    notes: >
      -1 unless ecg_is_measuring, else ecg_session.sample_count divided by 90 and
      clamped to 0..100 (0x4a778..0x4a790). A sample count turned into a
      percentage is the whole body.
  - name: ecg_adc_acquisition_stop
    address: 0x49c38
    ret: void
    notes: >
      reads and clears ecg_session.adc_running (0x49c3c, 0x49c42), drops the
      module mutex around the driver call at 0x49c4c and takes it again; it is
      the only clear of that field outside the reset.
  - name: ecg_module_init
    address: 0x4a6f8
    ret: void
    notes: >
      creates the ECG task queue and the module mutex (0x4a736), zeroes the stop
      semaphore, state and prev_state, and sets repeats_remaining to -1. It runs
      once from INIT and writes no other field.
  - name: ecg_task_state_machine
    address: 0x4a068
    ret: void
    notes: >
      takes the module mutex with a 500-tick timeout, loads ecg_session.state and
      dispatches on it through the seven-arm `tbh` at 0x4a094, every arm leaving
      through the single release at 0x4a0c8. A switch on the state field and
      nothing else.
  - name: ecg_adc_block_handler
    address: 0x49d78
    supersedes: shell_cmd_ecg__2
    ret: void
    notes: >
      the ADC block callback ecg_task_state_machine installs (its address is the
      pool word loaded at 0x4a1f0). It counts a dropped buffer when the mutex is
      not free (0x49db4, the "%u" of "Nb dropped buffers"), checks the block
      against ecg_session.expected_evt_counter and bumps it (0x49de0), walks the
      block's 0x32 samples, adds 0x32 to sample_count (0x49f54) and stops when
      that passes target_sample_count. The derived name it takes over came from
      the shell command that also calls it.
  - name: ecg_sample_ring_flush
    address: 0x49ff8
    ret: void
    notes: >
      the only reader of ecg_session.sample_ring that walks it whole: 0x90
      iterations from ring_wr, starting at zero or at the cursor depending on
      ring_wrapped (0x49ffe), emitting two samples at a time. Three ring fields
      and one emit call leave one reading.
  - name: hr_measure_lock
    address: 0x61ffc
    ret: i32
    notes: paired with hr_measure_unlock around every access to hr_screen_data.
  - name: hr_measure_unlock
    address: 0x62018
    ret: i32
    notes: the give that closes every hr_measure_lock.
  - name: hr_measure_reset_context
    address: 0x62040
    ret: void
    notes: >
      under the lock, zeroes hr_measure_ctx's measure_start_uptime,
      non_storable_count, the sixteen bytes from sdnn, rr_interval, rr_censored
      and rr_uptime, and clears hr_screen_data's live halfword (0x62064). It
      writes no field it does not zero.
  - name: hr_measure_set_live_hr
    address: 0x621a0
    ret: void
    args: [[u8, bpm], [bool, valid]]
    notes: >
      under the lock, stores its two arguments into hr_screen_data.live_valid and
      live_bpm and the current uptime into live_uptime (0x621ae..0x621ba).
  - name: hr_measure_get_screen_data
    address: 0x624b0
    supersedes: hr_measure_failed_to_get_screen_data
    ret: i32
    args: [[struct hr_screen_data *, out]]
    notes: >
      takes the lock and copies the sixteen bytes of hr_screen_data out with one
      `ldm`/`stm` pair; its derived name is the error line on the lock failure,
      not the role.
  - name: hr_measure_on_algo_result
    address: 0x62604
    ret: void
    args: [[const struct hr_algo_report *, report]]
    notes: >
      the sole consumer of hr_algo_report, reached only from 0x64072. It prints
      every field of the report under "[HR_MEASURE]", gates its burst block on
      the report's ready byte and stores the report's bpm into
      hr_measure_ctx.last_bpm, which is what the WPP handler answers with.
  - name: algo_manager_feed_sample
    address: 0x64214
    supersedes: sensors_sync_nothing_to_pop__1__1
    ret: void
    args: [[void *, ctx], [struct algo_sample_frame *, frame]]
    notes: >
      one frame in, one round of the algorithms out: it keeps one sample in every
      rate/25 (the `udiv` by 0x19 at 0x64242 against the configured rate), calls
      algo_dispatch_sample and then tail-calls the publisher 0x63ddc with the
      same context. Its only caller is sensors_sync_slot_to_algo.
  - name: algo_manager_publish_results
    address: 0x63ddc
    ret: void
    args: [[void *, ctx]]
    notes: >
      the other half of algo_manager_feed_sample: a chain of algo_enabled gates,
      each followed by a read of that algorithm's own result object and a call to
      that algorithm's consumer; the heart-rate arm builds a hr_algo_report on
      its stack (0x63fc4..0x64068) and hands it to hr_measure_on_algo_result.
  - name: hr_algo_get_result
    address: 0xa24e0
    ret: i32
    args: [[struct hr_algo_report *, out]]
    notes: >
      refuses with -2 while the HR algorithm's mode byte is zero, otherwise
      copies hr_algo_result's bpm, bpm_ref, ready and acceptable as one word and
      quality as one byte into the caller's report and returns the status field.
      It is the only reader of that five-byte group.
  - name: hr_algo_step
    address: 0x7aa60
    ret: i32
    notes: >
      the only writer of hr_algo_result's bpm, bpm_ref, ready, acceptable,
      quality, warm and status. It steps the three channel filters and the motion
      filter, sets warm once all four report ready (0x7aade), and on a full
      window converts the rate and the quality to bytes (0x7ac6c, 0x7ac88) and
      decides acceptability from the sample count and the distance to bpm_ref.
  - name: hr_algo_reset
    address: 0xa2548
    ret: i32
    notes: >
      resets the four filters of hr_algo_result, memsets its three 0x98-byte
      buffers and puts status back to -3 with bpm, quality and warm at zero
      (0xa257c..0xa2592). The mirror of hr_algo_step and nothing else.
  - name: hrv_get_sdnn
    address: 0xa47f6
    ret: i32
    args: [[void *, hrv]]
    notes: one load whose result is hr_measure_ctx.sdnn and the `%ld` of "sdnn:".
  - name: hrv_get_rmssd
    address: 0xa47fa
    ret: i32
    args: [[void *, hrv]]
    notes: one load whose result is hr_measure_ctx.rmssd and the `%ld` of "rmssd:".
  - name: hrv_get_quality
    address: 0xa4802
    ret: i8
    args: [[void *, hrv]]
    notes: >
      one load whose result is hr_measure_ctx.hrv_quality, the `%d` the
      "Poor quality %d < %d" line compares against 0x14.
  - name: rr_get_interval
