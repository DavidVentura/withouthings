  - name: wpp_obj_DebugDumpData_encode
    address: 0x99346
    ret: void
    args: [[const struct wpp_DebugDumpData *, obj], [void **, cursor]]
    notes: WPP object type 285 (DebugDumpData)
  - name: wpp_obj_DebugDumpMask_parse
    address: 0x4ee88
    ret: i32
    args: [[void **, cursor], [u16, len], [struct wpp_DebugDumpMask *, out]]
