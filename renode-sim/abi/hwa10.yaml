# HWA10 (ScanWatch 2) application firmware v3411 — machine-readable ABI.
# Hand-edited; `python3 abi/gen.py` turns it into out/hwa10.h and out/hwa10.ld.
# Addresses are virtual (appl image is linked at 0x27000) and are given WITHOUT
# the Thumb bit; gen.py sets it for everything under `functions`.
# symbols.txt is the prose map of the same firmware; this file is the subset
# whose prototype is known well enough to call.

meta:
  firmware: appl v3411
  cpu: cortex-m4
  float_abi: hard          # the app runs with the VFP on (vPortEnableVFP @0x73dfc)
  app_base: 0x27000
  app_end: 0xf117c
  bootloader_base: 0xfc000

regions:
  # Both ranges are argued for in notes; abi/relink.ld's MEMORY mirrors them.
  - name: LIBRARY_FLASH
    start: 0xf1180
    size: 0xae80
    kind: flash
    notes: >
      Internal flash between the end of the app image (0xf117c) and the
      bootloader (0xfc000). The app can only program internal flash through two
      leaf routines, int_flash_erase_range (0x3a318) and int_flash_write
      (0x3a348); the only callers in the image are the thunks 0x9ab8e/0x93786,
      whose single caller is the UART debug shell's "erase range" command
      (strings 'erase'/'range' at 0xde12b/0xda248, handler around 0x53920).
      Nothing on the normal boot or WPP path writes internal flash: settings and
      the firmware banks live in the external MX25R (dblib / fwblk). Confirmed
      in the sim over 600 s of virtual time with a WPP session and a time write:
      the NVMC model logged no ERASEPAGE and a snapshot of 0xf1000..0xfc000
      taken at reset verified byte-identical at the end of the run.
      The start is the app image end rounded up to the 16 bytes .libtext's own
      alignment asks for, not a round address: abi/relink.ld puts the relinked
      library here so that app and library are one contiguous block and travel
      as one `appl` part in a firmware package. Word alignment is all the
      package needs, since a part's CRC32 is taken over its length rounded up
      to a word and the bootloader's copy (0xfc78c) is byte-addressed and
      512-byte chunked. The size runs to the bootloader at 0xfc000.
  - name: LIBRARY_RAM
    start: 0x20034000
    size: 0x6000
    kind: ram
    notes: >
      The app's initial MSP is 0x20040000 (top of the 256 KB SRAM) and the main
      stack grows down from there. After 600 s of virtual time that included a
      BLE connection, a WPP probe, the read-only command walk, a time write and
      the algorithm manager running, a dump of 0x20026000..0x20040000 was
      non-zero only in 0x20026000..0x2002ae00 (statics and the FreeRTOS heap)
      and 0x2003f000..0x20040000 (the main stack's low-water mark). The 0x14200
      bytes between them were never written. 0x20034000 sits in the middle of
      that hole, 0x9200 above the highest used static and 0xb000 below the
      deepest the stack reached, and 0x2003a000 is still 0x5000 below it; the
      source heap_4 brings its own 16 KB ucHeap, which is what the size holds.
      Cross-checked by snapshotting this exact range
      at reset with the NVMC model's SnapshotProtectedRegion (it works on any
      sysbus range, not just flash) and verifying it at the end of the run:
      zero words differed.

functions:
  # --- FreeRTOS ---
  - name: prvIdleTask
    address: 0x27da0
    ret: void
    args: [[void *, pvParameters]]
    corrects: 0x27da6
    notes: >
      The body match anchors a start on a `bl` target, and nothing calls the
      idle task, so it settled on 0x27da6 and left the `push {r3-r7,lr}` at
      0x27da0 in a gap, six bytes the relayout was free to separate from the
      body. The entry is the xTaskCreateStatic at 0x73032, whose r0 pool word
      (0x73070) holds 0x27da1 and whose r1 names "IDLE".
  - name: xTaskCreateStatic
    address: 0x9e3dc
    ret: void *
    args: [[void *, pxTaskCode], [const char *, pcName], [u32, ulStackDepth],
           [void *, pvParameters], [u32, uxPriority], [void *, puxStackBuffer],
           [void *, pxTaskBuffer]]
    notes: stock FreeRTOS prototype; r0=entry, r2=stack words, priority on the stack
  - name: xQueueSemaphoreTake
    address: 0x9e890
    ret: i32
    args: [[void *, xQueue], [u32, xTicksToWait]]
    notes: 0xffffffff ticks = block forever
  - name: xQueueGenericSend
    address: 0x73a90
    ret: i32
    args: [[void *, xQueue], [const void *, pvItemToQueue], [u32, xTicksToWait],
           [i32, xCopyPosition]]
    notes: >
      called with a NULL handle by battery_sem_give before battery_task exists;
      machine.resc patches the sim around it
  - name: xTaskNotifyWait
    address: 0x7382c
    ret: i32
    args: [[u32, ulBitsToClearOnEntry], [u32, ulBitsToClearOnExit],
           [u32 *, pulNotificationValue], [u32, xTicksToWait]]
    notes: main's wait; the bit dispatcher is 0x4ec0c
  - name: vPortYield
    address: 0x9e46c
    ret: void
    args: []
    notes: >
      pends PendSV via ICSR and returns — taskYIELD, NOT vTaskDelay. Anything
      calling this address as vTaskDelay(ticks) would silently not delay.
  - name: vTaskStepTick
    address: 0x730ac
    ret: void
    args: [[u32, xTicksToJump]]
    notes: inferred from the tickless-idle catch-up call site at 0x73f82
  - name: xTaskIncrementTick
    address: 0x730bc
    ret: i32
    args: []

  # --- logging ---
  - name: wlog
    address: 0x8f460
    ret: void
    args: [[const char *, fmt]]
    variadic: true
    notes: >
      the app's printf into the wlog ring that reaches UART0; `push {r0,r1,r2,r3}`
      prologue is the AAPCS va_list spill, so it is callable as a plain variadic.
      Format strings carry their own trailing newline.
  - name: wlog_level
    address: 0x50ca8
    ret: void
    args: [[u32, level], [const char *, fmt]]
    variadic: true
    notes: inferred; r0 is a small level constant (5 at the 0x4029a call site), fmt in r1
  - name: wlog_putchar
    address: 0x56e8e
    ret: void
    args: [[u8, c]]
    notes: >
      NOT AAPCS-callable: the ring context comes in r12, so this is the sink the
      formatter installs, not an entry point. Listed for completeness; call wlog.

  # --- WPP / BLE ---
  - name: wpp_bytes_received
    address: 0x392fc
    ret: void
    args: [[const void *, data], [u32, len]]
    notes: entry the three GATT write demuxes at 0x93654 funnel into
  - name: sd_ble_gatts_hvx_send
    address: 0x935c0
    ret: i32
    args: [[const void *, p_data], [u16, len], [u8, type]]
    notes: builds ble_gatts_hvx_params_t and issues svc 0xae via the thunk at 0x935b4
  - name: wpp_cmd_battery_status
    address: 0x6ca91
    ret: void
    args: [[const void *, objects], [u16, len]]
    notes: >
      WPP command 1284 handler, entry 127 of wpp_cmd_table. Reads the battery
      level, then replies with command 0x504. Ignores its argument. Address
      carries the Thumb bit as it is stored in the table; gen.py masks it off
      and sets it again.

  # --- WPP wire codec primitives ---
  # Every one of these was read off its own body: the cursor is a `void **`
  # whose target the call advances by exactly the width it moved, and the
  # big-endian order is the byte-by-byte stores themselves. They are declared
  # here because they are the alphabet abi/protocol.py reads the object layouts
  # in, and because the tail calls into them cost three of them their function
  # start: 0x98d98 became a second range of wpp_obj_WamScreensList_encode the
  # same way 0x4ca80 became one of fwblk_table_open.
  - name: wpp_put_u8
    address: 0x9a930
    ret: void
    args: [[void **, cursor], [u8, value]]
  - name: wpp_get_u8
    address: 0x9a93c
    ret: void
    args: [[u8 *, out], [void **, cursor]]
  - name: wpp_put_be16
    address: 0x9a954
    ret: void
    args: [[void **, cursor], [u16, value]]
  - name: wpp_get_be16
    address: 0x9a966
    ret: void
    args: [[u16 *, out], [void **, cursor]]
  - name: wpp_put_be32
    address: 0x9a982
    ret: void
    args: [[void **, cursor], [u32, value]]
  - name: wpp_get_be32
    address: 0x9a9a0
    ret: void
    args: [[u32 *, out], [void **, cursor]]
  - name: wpp_put_string
    address: 0x98d72
    ret: void
    args: [[void **, cursor], [const u8 *, pascal_string]]
    notes: >
      the source is length-prefixed and the length is clamped to 0x40 before
      both the count byte and the copy, so a string field on this wire is at
      most 64 bytes and the firmware truncates rather than failing
  - name: wpp_put_array_u8
    address: 0x98d98
    ret: void
    args: [[void **, cursor], [const u8 *, data], [u8, count]]
  - name: wpp_put_array_be32
    address: 0x98db8
    ret: void
    args: [[void **, cursor], [const u32 *, data], [u8, count]]
  - name: wpp_get_string
    address: 0x4eca4
    ret: void
    args: [[void **, cursor], [u8 *, out]]
    notes: >
      same 0x40 clamp as wpp_put_string, and it logs at level 3 when the wire
      length is above it rather than rejecting the object
  - name: wpp_get_array_u8
    address: 0x4ece8
    ret: void
    args: [[void **, cursor], [u8 *, out], [u8, max_count]]
    notes: >
      the count byte is clamped to max_count, with a level-3 log when they
      differ; the caller's buffer bound is the only check
  - name: wpp_get_array_be32
    address: 0x4ed3c
    ret: void
    args: [[void **, cursor], [u32 *, out], [u8, max_count]]

  # --- battery / charger ---
  - name: battery_adc_value_gain_adaptation
    address: 0x400b4
    ret: i32
    args: []
    notes: >
      SAADC AIN0; the gain adaptation is gated on product id 0x280010. Named by
      the __func__ the function logs, which symbols.txt already follows; the
      manifest still carried the older battery_adc_read.
  - name: battery_level_get
    address: 0x920f4
    ret: void
    args: [[u8 *, out_percent]]
    notes: inferred from the WPP battery handler, which passes a single byte slot
  - name: battery_pct_to_mv
    address: 0x40220
    ret: i16
    args: [[i32, percent]]
    notes: >
      inferred; empty_mv + (percent * (full_mv - empty_mv) + 50) / 100, i.e. it
      turns a percentage into the millivolts the battery reply carries
  - name: bq25180_status
    address: 0x43960
    ret: i32
    args: [[void *, dev]]
    notes: inferred; reads STAT0, logs "VIN_PGOOD = %hu"
  - name: bq25180_charge_enable
    address: 0x43a0c
    ret: i32
    args: [[void *, dev], [i32, enable]]
    notes: inferred; sets/clears ICHG_CTRL bit 7 (CHG_DIS)
  - name: bat_charging_decision
    address: 0x2fc8c
    ret: i32
    args: []
    notes: I2C error -> 2, VIN_PGOOD=0 -> 0, else the table at 0xc6cbc

  # --- fwblk (external-flash firmware bank table) ---
  - name: fwblk_table_parse
    address: 0x4ca80
    ret: struct fwblk_table *
    args: [[u32, flash_offset], [struct fwblk_table *, out], [void *, body_buf]]
    notes: >
      Reads the {u16 ver, u16 len} header at flash_offset out of the external
      flash through spi_flash_handle (0xb244c is its only pool word), rejects
      the version with fwblk_unsupported_ext_table_ver (0x4ca64), reads
      4 + align4(len) + 4 bytes into body_buf, and checks the trailing CRC32
      against crc32(body, 4 + align4(len)) -- the log lines "version %d",
      "size %d" and "[FWBLK] ext. table corrupted (crc computed=0x%lx,
      extracted=0x%lx)" are its own. Both pointer arguments are optional: a
      NULL body_buf is malloc'd (and freed again on any failure, which is how
      the caller-supplied case is told apart at 0x4cb38), a NULL out is a
      malloc of 12, the struct's size. Returns out, or NULL on any failure.
      Declared here because seeding the neighbour 0x9800a cost this body its
      function start: 0x9800e/0x98012 tail-call into it, so with no start of
      its own the whole body became a second range of 0x9800a.
  - name: fwblk_table_open
    address: 0x9800a
    ret: struct fwblk_table *
    args: [[u32, flash_offset]]
    notes: >
      `movs r2,#0; mov r1,r2; b.w fwblk_table_parse` -- the both-allocated
      form. Its caller 0x655f0 is the shell's bank dump, which passes 0x6000
      for bank 1 and 0x11f000 for bank 2, the two bank offsets FIRMWARE.md
      gives, so flash_offset is a byte offset into the external flash.
  - name: fwblk_table_free
    address: 0x98016
    ret: struct fwblk_table *
    args: [[struct fwblk_table *, table]]
    notes: >
      frees table->body then table, NULL-safe; returns its argument because the
      free is a tail call
  - name: fwblk_table_payload
    address: 0x9802e
    ret: void
    args: [[struct fwblk_table *, table], [const void **, out_data], [u16 *, out_len]]
    notes: >
      hands back body+4 and the u16 length the header holds at body+2, i.e. the
      IE stream fwblk_get_ie (0x4cb90) walks

  # --- crown ---
  - name: crown_read_reg
    address: 0x49074
    ret: i32
    args: [[u8, reg], [u8 *, out]]
    notes: inferred from the PAT9125 probe's id reads
  - name: crown_read_motion
    address: 0x49218
    ret: i32
    args: [[i16 *, delta_x], [i16 *, delta_y]]
    notes: >
      Delta_XY_Hi decode, negated. The caller at 0x2ee64 passes NULL for
      delta_y and 0x979d8 stores through it; machine.resc patches the sim.
  - name: crown_probe
    address: 0x4943c
    ret: i32
    args: []
    notes: power-up sequence plus the 0x31/0x92 id gate

  # --- WPP dispatch and framing ---
  - name: wpp_cmd_dispatch
    address: 0x6c784
    ret: i32
    args: [[u16, command], [const void *, objects], [u16, len]]
    notes: >
      the master-request walk: steps wpp_cmd_table by 12 between the pair
      (0x274b4, 0x27ba4) its literal pool holds, logs the row's name when +8 is
      non-null, calls +4 with (objects, len) and returns 0, or -1 when no row
      matches
  - name: wpp_cmd_dispatch_slave
    address: 0x6e788
    ret: i32
    args: [[u16, command], [u32, phase], [const void *, objects], [u16, len]]
    notes: >
      the same walk over (0x27ba4, 0x27c04) with one more argument; the row is
      a tail call, so the handler's result is this one's
  - name: wpp_obj_parse
    address: 0x504b4
    ret: i32
    args: [[void *, out], [const void *, data], [u16, len], [u16, type],
           [wpp_obj_parser, parse]]
    notes: >
      the TLV walk every request handler reaches its objects through. Reads the
      {u16 type, u16 length} header at the cursor with 0x9a8fe, skips the object
      when the type does not match, and on a match calls parse with the advanced
      cursor, the object's length and out. -2 when the stream runs out before a
      match ("not found" log at 0x50510), -1 when parse fails.
  - name: wpp_obj_header_get
    address: 0x9a8fe
    ret: void
    args: [[void **, cursor], [u16 *, out_type], [u16 *, out_len]]
    notes: >
      the two big-endian u16 of an object header, read through the same cursor
      the field primitives use; its only caller is wpp_obj_parse
  - name: wpp_send_object
    address: 0x9d38a
    ret: void
    args: [[const void *, obj], [u16, command], [wpp_obj_sizer, size],
           [wpp_obj_encoder, encode]]
    notes: >
      builds a 0xb0-byte frame on its own stack (0x9d30e), appends the one
      object through 0x9d322 and hands the frame to the link layer with
      0x6bd0c. 0x9d3d8 is a `b.w` to it and is the entry every reply site in
      the image actually calls.
  - name: wpp_send_object_alias
    address: 0x9d3d8
    ret: void
    args: [[const void *, obj], [u16, command], [wpp_obj_sizer, size],
           [wpp_obj_encoder, encode]]
    notes: the `b.w 0x9d38a` thunk; declared because it is what the handlers call
  - name: wpp_send_empty
    address: 0x9d3b4
    ret: void
    args: [[u16, command]]
    notes: the same frame with an empty object list, i.e. a command and nothing else
  - name: wpp_frame_append_object
    address: 0x9d322
    ret: void
    args: [[void *, frame], [const void *, obj], [wpp_obj_sizer, size],
           [wpp_obj_encoder, encode]]
    notes: >
      appends one object to a frame the caller already has; the (sizer,
      encoder) pair in r2/r3 is what abi/protocol.py reads a reply's type from
  - name: wpp_obj_BatteryStatus_size
    address: 0x98fe4
    ret: i32
    args: [[const void *, obj]]
    notes: >
      `movs r0, #0xe; bx lr` -- BatteryStatus's ten data bytes plus the
      four-byte header. It is the r2 wpp_cmd_battery_status loads at 0x6caca
      alongside the encoder in r3, which is the only thing that ties this
      one-instruction stub to this object type; the constants around it
      (0x98fe8 returns 0x18, 0x98fec 0x1d, 0x98ff0 0xb) are the same stub for
      other types and are left unnamed because no call site has been read for
      them.
  - name: battery_status_fill_state
    address: 0x9211e
    supersedes: WPP_CMD_BATTERY_STATUS__1
    ret: void
    args: [[struct wpp_BatteryStatus *, out]]
    notes: >
      stores the charge state into out+1: 0 while the charger reports an error
      (0x922a2), otherwise 2 when the charger is idle and 1 or 3 from
      bat_charging_decision's verdict. Its only caller is wpp_cmd_battery_status,
      which is also what fixes its argument type.

  # The three table handlers the image also calls directly, so their prototype
  # has to hold at a `bl` as well as at the dispatcher's `blx`. The names are
  # abi/autonames.py's, taken from the table row's own name string, so that the
  # manifest adds a prototype without forking the name.
  - name: WPP_CMD_PROBE
    address: 0x6c84c
    ret: void
    args: [[const void *, objects], [u16, len]]
    notes: >
      row 257 of wpp_cmd_table, and also the branch the frame demux 0x6bfa8
      takes at 0x6c088 when the command word is 0x101, with the same
      (objects, len) pair it would have given the dispatcher
  - name: WPP_CMD_MTU_EXCH
    address: 0x6d2e0
    ret: void
    args: [[const void *, objects], [u16, len]]
    notes: row 341, called directly at 0x6c0aa on the 0x155 branch of the same demux
  - name: WPP_CMD_SYNC_REQUEST
    address: 0x3ff1c
    ret: i32
    args: [[u32, phase], [const void *, objects], [u16, len]]
    notes: >
      row 321 of wpp_cmd_table_slave, so the three-argument prototype; the
      second caller is wpp_lite_client_cmd_dropped (0x6e7e8), which is inside
      the slave walk and passes the same three

  # --- WPP object codecs ---
  # Generated with abi/protocol.py; the names are abi/autonames.py's own, which
  # is why they are repeated here rather than left to autonames.yaml: only the
  # manifest can give them a prototype in the unguarded part of the header.
  # Regenerate with:
  #   python3 abi/protocol.py --emit-codecs-yaml /tmp/wppcodecs.yaml
  - name: wpp_obj_Null_encode
    address: 0x9917a
    ret: void
    args: [[const struct wpp_Null *, obj], [void **, cursor]]
    notes: WPP object type 256 (Null)
  - name: wpp_obj_Null_encode_copy_0x9a918
    address: 0x9a918
    ret: void
    args: [[const struct wpp_Null *, obj], [void **, cursor]]
    notes: WPP object type 256 (Null)
  - name: wpp_obj_Null_parse
    address: 0x4ed90
    ret: i32
    args: [[void **, cursor], [u16, len], [struct wpp_Null *, out]]
    notes: WPP object type 256 (Null)
  - name: wpp_obj_BatteryPercent_encode
    address: 0x99216
    ret: void
    args: [[const struct wpp_BatteryPercent *, obj], [void **, cursor]]
    notes: WPP object type 263 (BatteryPercent)
  - name: wpp_obj_Cmderror_encode
    address: 0x9923a
    ret: void
    args: [[const struct wpp_Cmderror *, obj], [void **, cursor]]
    notes: WPP object type 272 (Cmderror)
  - name: wpp_obj_Cmderror_parse
    address: 0x4edb0
    ret: i32
    args: [[void **, cursor], [u16, len], [struct wpp_Cmderror *, out]]
    notes: WPP object type 272 (Cmderror)
  - name: wpp_obj_StoredMeasureMeta_encode
    address: 0x99266
    ret: void
    args: [[const struct wpp_StoredMeasureMeta *, obj], [void **, cursor]]
    notes: WPP object type 278 (StoredMeasureMeta)
  - name: wpp_obj_StoredMeasureData_encode
    address: 0x992ae
    ret: void
    args: [[const struct wpp_StoredMeasureData *, obj], [void **, cursor]]
    notes: WPP object type 279 (StoredMeasureData)
  - name: wpp_obj_ConnectReason_encode
    address: 0x992e4
    ret: void
    args: [[const struct wpp_ConnectReason *, obj], [void **, cursor]]
    notes: WPP object type 280 (ConnectReason)
  - name: wpp_obj_UserUnit_encode
    address: 0x99308
    ret: void
    args: [[const struct wpp_UserUnit *, obj], [void **, cursor]]
