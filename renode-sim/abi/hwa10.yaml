typedefs:
  # The dispatchers fix these, not the handlers: a handler is only ever reached
  # through the table, so whatever the walk loads into r0..r2 before `blx r3`
  # is the whole of its interface.
  - name: wpp_cmd_handler
    ret: void
    args: [[const void *, objects], [u16, len]]
    notes: >
      wpp_cmd_table's row +4. The master dispatcher 0x6c784 is called at 0x6c0c2
      as (command, objects, len) out of the frame the header parser 0x50460
      filled -- sp+0x14 is the pointer past the five-byte header and sp+0x10 the
      remaining length -- and at 0x6c7a8..0x6c7ae it moves those two into r0/r1
      and calls the row. It then returns 0 unconditionally, so a handler's
      return value is never read.
  - name: wpp_cmd_slave_handler
    ret: i32
    args: [[u32, phase], [const void *, objects], [u16, len]]
    notes: >
      wpp_cmd_table_slave's row +4. The slave dispatcher 0x6e788 takes
      (command, phase, objects, len) and shifts them down by one into the row at
      0x6e7c0..0x6e7cc, a `bx r3` tail call, so the handler's return value is the
      dispatcher's and its callers compare it against 1. phase is a literal at
      every call site: 1 at 0x6e856, 3 at 0x6e948, 4 at 0x6e9cc and a register
      at 0x6e8ec; objects and len are the same frame pair the master path uses
      and are 0/0 on the two sites that carry no payload.
  - name: shell_cmd_run
    ret: i32
    args: [[i32, argc], [char **, argv]]
    notes: >
      shell_cmd_entry's +4, called at 0x5a242..0x5a248 with the argument count
      from sp+4 and the argument vector at sp+8; the result is what the shell
      reports.
  - name: shell_cmd_help
    ret: void
    args: []
    notes: >
      shell_cmd_entry's +8, called at 0x5a25c with no argument set up and its
      result discarded, on the row whose argument strcmps equal to "--help"
  - name: wpp_obj_encoder
    ret: void
    args: [[const void *, obj], [void **, cursor]]
    notes: >
      what the frame appender 0x9d322 is handed in r3 and calls as (object,
      &cursor); every wpp_obj_*_encode body opens `mov r4, r1; mov r5, r0` and
      loads its fields off r5
  - name: wpp_obj_sizer
    ret: i32
    args: [[const void *, obj]]
    notes: >
      the r2 of the same appender: the object's data length, a constant for a
      fixed-size type (0x98fe4 is `movs r0,#0xe; bx lr`, BatteryStatus's ten
      bytes plus the four-byte header) and a computation off the object for a
      variable one (0x98ff4 is `ldrb r0,[r0]; adds r0,#5`)
  - name: wpp_obj_parser
    ret: i32
    args: [[void **, cursor], [u16, len], [void *, out]]
    notes: >
      the callback wpp_obj_parse (0x504b4) stores at [sp] and calls at 0x504ea
      with r0 = &cursor (the stack slot it has already advanced past the TLV
      header), r1 = the object's data length and r2 = the caller's out pointer;
      a non-zero return is logged as a parse failure and turns into -1

structs:
  - name: nrf_nvic_state
    fields: [[u32, __irq_masks_0], [u32, __irq_masks_1], [u32, __cr_flag]]
  - name: crown_ctx
    fields: [["u8[0x10]", pad], [u16, idle_window_ms], [u16, step_threshold]]
    notes: only the two fields at +0x10/+0x12 are identified
  - name: wpp_service_ctx
    fields: [[u32, pad0], [u16, wpp_v2_value], [u16, pad1], [u16, wpp_v2_cccd],
             [u16, pad2], [u16, wpp_v3_value], [u16, pad3], [u16, wpp_v3_cccd],
             [u16, pad4], [u16, wpps_value], [u16, pad5], [u16, wpps_cccd],
             ["u8[0x32]", pad6], [u32, subscribe_bits],
             ["u8[0xc4]", pad7], [u16, staged_len], ["u8[0x2]", pad8],
             [u8, tls_state], ["u8[0x5f]", pad9],
             [u32, record_expected], [u32, record_filled], [void *, record_buf]]
    notes: >
      handle pairs at +4/+8 (WPP_V2), +0xc/+0x10 (WPP_V3), +0x14/+0x18 (WPPS);
      subscribe bits at +0x4c, bit 3 selects the WPPS TLS record path.
      The tail is wpp_bytes_received's own: it memcpys the write into +0x4f and
      stores the length at +0x118 (0x3930c..0x39314), reads +0x4c and +0x4d as
      two bytes and tests bit 3 of their OR (0x39318..0x39324), and when that
      bit is set runs the TLS record path over +0x17c (bytes still owed for the
      record, `cmp r1,#0x54` at 0x39384), +0x180 (bytes of the five-byte record
      header already in hand, compared against 5 at 0x39364) and +0x184 (the
      record buffer, a fixed address stored at 0x39344). +0x11c is the TLS state
      symbols.txt gives: 0 idle, 1 handshaking, 2 established, and
      wpps_established (0x39124) is `ctx[0x11c] == 2`.
  - name: rambkp
    fields: [["u8[0x14]", pad], [u8, boot_mode], [u8, boot_attempts], ["u8[0xa]", pad2], [u32, crc]]
    notes: mode at +20, attempt counter at +21, CRC at +32
  - name: battery_curve_bounds
    fields: [[u32, pad], [i16, full_mv], [i16, empty_mv]]
  - name: battery_state
    fields: [["u8[0x8]", pad], [u16, ready]]
    notes: >
      only +8 is identified: battery_measure_get tests it at 0x40284 and takes
      the fresh-conversion path when it is zero
  - name: fwblk_table
    fields: [[u32, payload_offset], [u32, len], [void *, body]]
    notes: >
      what fwblk_table_parse fills at 0x4cb5c..0x4cb66: the external-flash
      offset of the payload (the header offset plus 4), the u16 length from the
      header widened to a word, and the buffer holding header + payload + CRC32
  - name: wpp_cmd_entry
    fields: [[u32, id], [void *, handler], [const char *, name]]
    notes: handler carries the Thumb bit as stored

  # --- WPP objects, in memory ---
  # One struct per wire object type, recovered by abi/protocol.py from the
  # codecs themselves: the encoder loads every field off r0 before handing it to
  # a cursor primitive, and the parser hands the primitive a pointer into r2, so
  # the offset and the width of each field are the instruction's own. Wire order
  # is what the conformance check already matched against wpp/src/objects.rs
  # field for field, which is what names them. Signedness is the encoder's
  # `ldrsb`/`ldrsh` where it has one; a four-byte load cannot say, so every
  # 32-bit field reads u32 here even where the crate calls it i32. The notes
  # carry the encoder and parser addresses and the site of every load or store.
  # Regenerate with:
  #   python3 abi/protocol.py --emit-structs-yaml /tmp/wppstructs.yaml
  - name: wpp_Null
    fields: []
    notes: >
      WPP object type 256 (Null), 0 bytes; encoder 0x9917a; encoder 0x9a918; parser 0x4ed90.
  - name: wpp_BatteryPercent
    fields: [[u16, percent]]
    notes: >
      WPP object type 263 (BatteryPercent), 2 bytes; encoder 0x99216 (+0x0@0x99236).
  - name: wpp_Cmderror
    fields: [[u16, cmd], ["u8[0x2]", pad_2], [u32, err]]
    notes: >
      WPP object type 272 (Cmderror), 8 bytes; encoder 0x9923a (+0x0@0x99256 +0x4@0x99262); parser 0x4edb0 (+0x0@0x4edbc +0x4@0x4edc4).
  - name: wpp_StoredMeasureMeta
    fields: [[u32, uid], [u8, user_id_cnt], ["u8[0x3]", pad_5], ["u32[0x3]", user_id], [u8, attrib], ["u8[0x3]", pad_15], [u32, time]]
    notes: >
      WPP object type 278 (StoredMeasureMeta), 28 bytes; encoder 0x99266 (+0x0@0x99282 +0x4@0x9928a +0x8@0x99296 +0x14@0x9929e +0x18@0x992aa).
  - name: wpp_StoredMeasureData
