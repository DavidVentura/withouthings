    notes: >
      the handle xQueueCreateMutexStatic leaves at 0x59700, taken with
      portMAX_DELAY by sensors_sync_lock and given by sensors_sync_unlock; its
      static queue storage is the 0x54 bytes at 0x2001d280.
  - name: sensors_sync_slots
    address: 0x2001d2d8
    type: "struct sensors_sync_slot[0x80]"
    notes: >
      the one buffer both streams write into, 0x2600 bytes; the wrap is the
      `cmp #0x80` in the push (0x597c0), in the consumer's read cursor (0x596a4)
      and in the `and #0x7f` at 0x5963a.
  - name: sensors_sync_flush_cb
    address: 0x2001f8d8
    type: sensors_sync_flush_fn
    notes: >
      written only by sensors_sync_set_flush_cb and called only at 0x59636;
      abi/out/ghidra shows INIT installing raw_data_save's 0x30ea0 there
      (pool word at 0x2e568).
  - name: sensors_sync_rd
    address: 0x2001f8dc
    type: u16
    notes: >
      the read cursor both streams share, which is what makes the two rings one
      ring: the push compares it against a stream's own write index to detect the
      overrun (0x5975c) and advances it past the lost slot (0x5978c), the
      consumer reads it to place the batch callback (0x595c0) and advances it once
      per popped slot (0x596aa), and sensors_sync_reset clears it (0x598a6).
  - name: sensors_sync_exception_flags
