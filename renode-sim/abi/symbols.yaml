- address: 0x3141c
  name: sensors_sync_slot_to_algo
  kind: function
  class: hand
  module: sensors_sync
  supersedes: sensors_sync_nothing_to_pop__1
  evidence: the only reader of a whole slot, and the only thing that gives the bit
    fields of sensor_sample_ppg a meaning. It zeroes a 0xec-byte frame, copies the
    three accelerometer axes into its head as one word plus one halfword (0x3143c..0x31440),
    and for each of the sixteen channel words emits a 0xc-byte record -- the sign-extended
    20-bit datum, the float 0x28758 makes out of the 9-bit and 2-bit fields, and
    bit 31 as a byte -- then hands the frame to 0x64214. Sixteen identical unrolled
    expansions of one struct field is what names it; the derived name it takes over
    came from the caller's log line.
