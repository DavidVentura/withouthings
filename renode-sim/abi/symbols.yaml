- address: 0x59584
  name: sensors_sync_drain
  kind: function
  class: hand
  module: sensors_sync
  supersedes: sensors_sync_nothing_to_pop
  evidence: the consumer side of the ring, and the reason the two streams are one.
    It takes the lock, reads each subscribed ring's fill count and keeps the smaller
    of the two (0x595a2), so the slower stream sets the pace; over that many slots
    from sensors_sync_rd it zeroes, in each slot, the byte range of any stream that
    is not subscribed or has nothing pending (0x595ec, 0x59602, using the stream's
    offset and size as one `ldrd`) and hands each contiguous run to sensors_sync_flush_cb
    (0x59636); it drains sensors_sync_exception_flags into 0x31410 (0x5964c); then
    it pops one slot at a time -- decrementing each subscribed ring's fill count,
    logging "Nothing to pop" if one is already empty, memcpying the 0x4c bytes to
    the stack and advancing sensors_sync_rd modulo 128 -- and hands each to sensors_sync_slot_to_algo
    (0x596b6). The derived name it takes over is one of its two error logs.
- address: 0x59700
  name: sensors_sync_mutex_init
  kind: function
  class: hand
  module: sensors_sync
  evidence: 'the only writer of sensors_sync_mutex: xQueueCreateMutexStatic over
    the static storage at 0x2001d280, called from INIT at 0x2e4a2 just before the
    flush callback is installed.'
- address: 0x59718
  name: sensors_sync_ring_push
  kind: function
  class: hand
  module: sensors_sync
  evidence: one sample into one of the two sensor rings. The body indexes a two-entry
    table of ring descriptors by the first argument and refuses anything above one
    (0x5971e), memcpys the sample into slot (write index * 0x4c) of the ring's buffer
    (0x597a0), advances the write index modulo 128 (0x597ac) and increments the
    fill count; when the reader's index has caught up it logs an overrun and drops
    the oldest slot instead. A ring with a write index, a wrap and a fill count
    is a push and nothing else.
