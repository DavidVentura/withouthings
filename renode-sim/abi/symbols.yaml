- address: 0x27100
  name: shell_cmd_table
  kind: table
  class: hand
  module: shell
  evidence: 'the UART debug console''s dispatch, sorted by command word so the walk
    can stop early. Head and end are the pair of literal-pool words every reader
    loads (0x27100 and 0x274b4 at 0x59cb8, 0x5a020, 0x5a134 and 0x5a270), and the
    stride is the reader''s own `adds r5, #0xc` / `ldr r1, [r4], #12`; the end is
    where wpp_cmd_table begins, so the two tables abut. An earlier reading put the
    head at 0x270f8, which is inside the vector table and shifted every row''s name
    onto the previous row''s handler.'
- address: 0x274b4
  name: wpp_cmd_table
  aliases:
  - wpp_master_cmd_table
  kind: table
  class: hand
  module: wpp
  evidence: 'master-request dispatch: the commands the phone sends. Runs 0x274b4
    to 0x27ba4, not to 0x27c04: the dispatcher at 0x6c784 and the send path''s name
    lookup at 0x6bdbe both load the pair (0x274b4, 0x27ba4) and step by 12 between
    them, and the eight rows above 0x27ba4 are walked by a different dispatcher
    (0x6e788) that loads (0x27ba4, 0x27c04) and calls its handler with three arguments
    instead of two. They are declared separately as wpp_cmd_table_slave. The rows
    themselves have the same shape either way, which is why a walk by shape alone
    reads the two as one table of 156; an earlier reading started it at 0x27994,
    which is row 104, not the head. abi/autonames.py walks it in both directions
    from there and stops where the row stops being {command id, odd handler in the
    image, pointer to a printable name}; the row above the head belongs to the shell''s
    own table (0x27100, 79 rows, a different shape: the command word first and two
    entry points after it). Each row''s name string is the handler''s source name,
    which is where abi/autonames.yaml''s wppcmd class comes from. No literal-pool
    reference to the table exists in the image, so the walker reaches it some other
    way; replacing a handler word in place works regardless (proven by diverting
    the battery handler to a logging hook).'
- address: 0x27ba4
  name: wpp_cmd_table_slave
  kind: table
  class: hand
  module: wpp
  evidence: The eight rows above wpp_cmd_table, dispatched by 0x6e788 rather than
    0x6c784. Both bounds are its own literal pool pair (0x6e7d4 and 0x6e7d8, repeated
    at 0x6e830/0x6e834), it logs "[WPP][<-]"-style lines with the row's name from
    +8 like the master walk, and it tail-calls the handler at +4 as `bx r3` after
    loading three arguments, so these handlers have a different prototype from the
    master-request ones. In address order the commands are SYNC_REQUEST 321, LOCAL_EVENT_NOTIFY
    2459, MEASURE_STOP 2420, MEASURE_START 2419, NOTIFICATION_GET 2404, GLYPH_GET
    2403, WORKOUT_STOP 318 and WORKOUT_START 317.
