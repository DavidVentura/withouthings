    corrupted (crc computed=0x%lx, extracted=0x%lx)" are its own. Both pointer arguments
    are optional: a NULL body_buf is malloc''d (and freed again on any failure,
    which is how the caller-supplied case is told apart at 0x4cb38), a NULL out
    is a malloc of 12, the struct''s size. Returns out, or NULL on any failure.
    Declared here because seeding the neighbour 0x9800a cost this body its function
    start: 0x9800e/0x98012 tail-call into it, so with no start of its own the whole
    body became a second range of 0x9800a.'
