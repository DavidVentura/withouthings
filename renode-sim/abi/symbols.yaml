- address: 0x9bd0c
  name: spi_flash_locked_op
  kind: function
  class: hand
  module: flash
  supersedes: shell_cmd_spiflash__8
  evidence: 'Twenty-two bytes of which ten are not a relocated field, and those
    ten are newlib''s _tzset_r exactly: push, move the argument aside, call, move
    it back, pop and tail-call. Every lock/operate/unlock wrapper and every errno
    stub has that shape, so the bytes name nothing and the branches do. These three
    go to 0x5b748, which takes the mutex at *0x0120e8f8 with xQueueSemaphoreTake
    and an infinite timeout, to 0x5b6ec, an SPI-flash operation that reaches spi_xfer_wait
    and is also called from flash_detect_fn, and to 0x5b6a4, which gives the same
    mutex back with xQueueGenericSend; the only caller is shell_cmd_spiflash. The
    argument travels through r0 untouched into the operation, which is all the wrapper
    does with it. Naming it here is what keeps the relink from replacing a flash
    lock with tzset, where only the shell would have run the difference.'
