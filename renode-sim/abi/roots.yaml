  - {name: wpp_fw_available_handler, address: 0x650e8}

reset_reaches:
  from: 0x34938
  to: 0x2ec78
  note: >
    0x34938 is the entry the vector table's reset word 0x27004 holds (0x34939,
    Thumb); it must reach the xTaskCreateStatic call at 0x2ec78 that creates the
    "main" task, which is the boot path the sim executes.
